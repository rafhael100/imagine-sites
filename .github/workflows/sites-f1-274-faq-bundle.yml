name: Sites F1-274 semantic FAQ package integrity fence
on:
  pull_request:
    paths:
      - 'src/Production/InertPreviewAudit.php'
      - 'tests/f274-faq-bundle-fence.php'
      - '.github/workflows/sites-f1-274-faq-bundle.yml'
permissions:
  contents: read
jobs:
  faq-release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml
          tools: none
          coverage: none
      - name: Reject malformed rehashed FAQ package and preserve baseline
        run: |
          set -euo pipefail
          php -l src/Production/InertPreviewAudit.php
          php -l tests/f274-faq-bundle-fence.php
          php tests/f27-offline-preview-audit.php
          php tests/f157-static-faq-content.php
          php tests/f270-faq-native-disclosure.php
          php tests/f271-faq-disclosure-revision.php
          php tests/f274-faq-bundle-fence.php
      - name: Scope
        if: always()
        run: echo 'Static noindex HTML, synthetic QA only; no delivery, client data, provider, DB mutation or deploy.'
