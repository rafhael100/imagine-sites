name: Sites F1-212 unified visual and social private Laravel reviewer
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticCompositeSocialReviewTest.php'
      - '.github/workflows/sites-f1-212-composite-social-review.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unified-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: PHP syntax for restricted review route
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticCompositeSocialReviewTest.php
      - name: Install reproducible Laravel CI requirements
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify multi-option UI, actual SHA and older review variants
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticCompositeSocialReviewTest|SyntheticSocialCardInspectionTest|SyntheticSocialPreviewReviewTest|SyntheticCompositeVisualReviewTest|SyntheticRichReviewUiTest)' --no-ansi
      - name: Boundary
        if: always()
        run: echo "Strict finite synthetic choices, CLI/loopback only; no client data, public sharing, CRM, publication or deploy."
