name: Sites OnePage R18 associative read stability (CI-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-private-head-digest-r17-20261123']
    paths:
      - 'src/Production/OnepageBuyerPrivatePreviewCandidate.php'
      - 'tests/onepage-associative-read-order-r18.php'
      - '.github/workflows/sites-onepage-field-order-r18.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-r18-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  associative-source-fields:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/onepage-associative-read-order-r18-20261123' &&
      github.event.pull_request.base.ref == 'fix/onepage-private-head-digest-r17-20261123' &&
      github.event.pull_request.base.sha == 'd69ddfc032327c401fedec61069b0bbdb76ca25c'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Verify offline associative wrapper and witness equality
        run: |
          set -euo pipefail
          php -l src/Production/OnepageBuyerPrivatePreviewCandidate.php
          php -l tests/onepage-associative-read-order-r18.php
          php tests/onepage-associative-read-order-r18.php | tee "$RUNNER_TEMP/onepage-r18.log"
          grep -Eq '^ONEPAGE ASSOCIATIVE FIELD ORDER R18 PASS: [0-9]+ checks; same synthetic order; NO-GO[.]$' "$RUNNER_TEMP/onepage-r18.log"
      - name: Confirm no operational authorization or secret
        run: |
          set -euo pipefail
          test ! -f .env.production
          test ! -d .pinned-portal
