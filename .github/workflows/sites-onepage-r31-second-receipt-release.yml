name: Sites OnePage R31 second receipt release fence (CI-only)
on:
  push:
    branches: ['fix/onepage-second-receipt-release-fence-r31-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-second-receipt-release-r31.php'
      - 'tests/onepage-buyer-preflight-release-r28.php'
      - 'tests/onepage-release-race-before-first-receipt-r29.php'
      - 'tests/onepage-receipt-race-before-first-presentation-r30.php'
      - '.github/workflows/sites-onepage-r31-second-receipt-release.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-recheck-first-receipt-before-presentation-r30-20261123']
permissions:
  contents: read
concurrency:
  group: sites-onepage-r31-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  receipt-release:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      (github.event_name == 'push' || (
        github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/onepage-second-receipt-release-fence-r31-20261123' &&
        github.event.pull_request.base.ref == 'fix/onepage-recheck-first-receipt-before-presentation-r30-20261123' &&
        github.event.pull_request.base.sha == 'ae37a149406a19a618238e15ae2918ca7c6d08f9'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
          tools: none
      - name: Exact SHA lint, R31 and affected regressions
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-second-receipt-release-r31.php
          php tests/onepage-second-receipt-release-r31.php
          php tests/onepage-receipt-race-before-first-presentation-r30.php
          php tests/onepage-release-race-before-first-receipt-r29.php
          php tests/onepage-buyer-preflight-release-r28.php
      - name: Preserve no-deploy gates
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -d .pinned-portal
          test ! -d .pinned-agents
          test ! -f deploy.sh
