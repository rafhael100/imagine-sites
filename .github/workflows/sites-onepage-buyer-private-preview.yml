name: Sites Onepage buyer private preview candidate (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/sites-landing-pg18-readback-head-serialization-2026-11-20-r29']
    paths:
      - 'src/Production/OnepageBuyerPrivatePreviewCandidate.php'
      - 'tests/onepage-buyer-private-preview-offline.php'
      - 'docs/reviews/SITES-ONEPAGE-BUYER-PRIVATE-PREVIEW-2026-11-20.md'
      - '.github/workflows/sites-onepage-buyer-private-preview.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-buyer-private-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  buyer-private-preview-no-effects:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/sites-onepage-buyer-private-preview-2026-11-20-r30' &&
      github.event.pull_request.base.ref == 'fix/sites-landing-pg18-readback-head-serialization-2026-11-20-r29' &&
      github.event.pull_request.base.sha == '8172e5cc14e97951e529c843059c214e05c33db5'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Syntax and synthetic buyer private preview checks
        run: |
          set -euo pipefail
          php -l src/Production/OnepageBuyerPrivatePreviewCandidate.php
          php -l tests/onepage-buyer-private-preview-offline.php
          php tests/onepage-buyer-private-preview-offline.php | tee "$RUNNER_TEMP/onepage-private-preview.log"
          grep -Eq '^ONEPAGE BUYER PRIVATE PREVIEW OFFLINE PASS: [0-9]+ checks; synthetic witnesses only; NO-GO[.]$' "$RUNNER_TEMP/onepage-private-preview.log"
      - name: Ensure no privileged integration was activated
        run: |
          set -euo pipefail
          test ! -d .pinned-portal
          test ! -e /run/secrets/imagine
          test ! -f .env.production
