name: Sites F1-178 opt-in internal anchors for Onepage
on:
  pull_request:
    paths:
      - 'src/Production/SiteBrief.php'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/InertPreviewAudit.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'src/Production/SyntheticStyleRevisionPlan.php'
      - 'src/Production/SyntheticContentRevisionPlan.php'
      - 'src/Production/SyntheticSectionOrderRevisionPlan.php'
      - 'src/Production/SyntheticEditorialPatchV1.php'
      - 'tests/f178-safe-section-anchor-navigation.php'
      - '.github/workflows/sites-f1-178-anchor-navigation.yml'
permissions:
  contents: read
jobs:
  anchors-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Syntax check touched classes
        run: |
          set -euo pipefail
          php -l src/Production/SiteBrief.php
          php -l src/Production/StaticSiteRenderer.php
          php -l src/Production/InertPreviewAudit.php
          php -l src/Production/SyntheticStructuredDraftAssembly.php
          php -l tests/f178-safe-section-anchor-navigation.php
      - name: New navigation and previous content/order/edit tests
        run: |
          set -euo pipefail
          php tests/f178-safe-section-anchor-navigation.php
          php tests/f175-static-section-order.php
          php tests/f171-editorial-patch.php
          php tests/f169-process-steps-copy-v4.php
          php tests/f159-services-highlights-ai-copy-v3.php
          php tests/f157-static-faq-content.php
          echo "No external links, operational permissions or site publishing."
