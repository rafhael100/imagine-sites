name: Sites Landing current private readback (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['integration/sites-landing-approved-brief-private-handoff-2026-11-20-r15']
    paths:
      - '.github/workflows/sites-landing-private-current-readback.yml'
      - 'apps/sites/app/Integration/CurrentPortalLandingPageApprovedBriefSource.php'
      - 'apps/sites/app/Integration/DenyingCurrentPortalLandingPageApprovedBriefSource.php'
      - 'apps/sites/app/Integration/PortalLandingPageApprovedBriefReadbackCandidate.php'
      - 'tests/landing-page-private-current-readback-offline.php'
permissions:
  contents: read
concurrency:
  group: sites-landing-private-current-readback-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  current-private-readback:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/sites-landing-private-current-readback-2026-11-20-r16' &&
      github.event.pull_request.base.ref == 'integration/sites-landing-approved-brief-private-handoff-2026-11-20-r15' &&
      github.event.pull_request.base.sha == '926f43e659d3b9944b3df0e93b497ff18f9157eb'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-portal
          ref: e0f38d8d98c151ffa5743c9c372ac039074b9ea7
          path: .pinned-portal
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Verify pinned Portal and lint
        run: |
          set -euo pipefail
          test "$(git -C .pinned-portal rev-parse HEAD)" = e0f38d8d98c151ffa5743c9c372ac039074b9ea7
          for f in \
            apps/sites/app/Integration/CurrentPortalLandingPageApprovedBriefSource.php \
            apps/sites/app/Integration/DenyingCurrentPortalLandingPageApprovedBriefSource.php \
            apps/sites/app/Integration/PortalLandingPageApprovedBriefReadbackCandidate.php \
            tests/landing-page-private-current-readback-offline.php; do
            php -l "$f"
          done
      - name: Current-head adversarial probes and existing cross-repository parity
        run: |
          set -euo pipefail
          php tests/landing-page-private-current-readback-offline.php | tee current.log
          grep -Eq '^SITES LANDING PRIVATE CURRENT READBACK PASS: [0-9]+ checks;' current.log
          php tests/landing-page-approved-brief-private-pair-offline.php | tee private.log
          grep -Eq '^SITES LANDING PRIVATE APPROVED BRIEF PARITY PASS: [0-9]+ checks;' private.log
          php tests/landing-page-current-admission-consistency-offline.php | tee admission.log
          grep -Eq '^SITES LANDING BOUND READBACK PASS: [0-9]+ checks;' admission.log
          php tests/landing-page-admission-pair-offline.php | tee projection.log
          grep -Eq '^SITES LANDING ADMISSION PARITY PASS: [0-9]+ checks;' projection.log
