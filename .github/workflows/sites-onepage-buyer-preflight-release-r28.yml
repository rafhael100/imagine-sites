name: Sites OnePage R28 buyer preflight before confidential release (CI-only)
on:
  push:
    branches: ['fix/onepage-buyer-preflight-release-r28-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-buyer-preflight-release-r28.php'
      - 'tests/onepage-receipt-before-preview-r26.php'
      - '.github/workflows/sites-onepage-buyer-preflight-release-r28.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-recheck-rights-before-second-receipt-r27-20261123']
permissions:
  contents: read
concurrency:
  group: sites-onepage-r28-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  buyer-release-read:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      (github.event_name == 'push' || (
        github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/onepage-buyer-preflight-release-r28-20261123' &&
        github.event.pull_request.base.ref == 'fix/onepage-recheck-rights-before-second-receipt-r27-20261123' &&
        github.event.pull_request.base.sha == 'ff43959d77bcdc78655e9c41fafa166afde13137'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
          tools: none
      - name: Exact SHA, lint, buyer-release R28 and affected R26/R27 regressions
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-buyer-preflight-release-r28.php
          php tests/onepage-buyer-preflight-release-r28.php
          php tests/onepage-receipt-before-preview-r26.php
          php tests/onepage-recheck-rights-before-second-receipt-r27.php
      - name: Keep all operational gates blocked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -d .pinned-portal
          test ! -d .pinned-agents
          test ! -f deploy.sh
