name: Sites F1-161 Laravel rich FAQ/highlights review UI - CLI only
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticRichReviewUiTest.php'
      - 'fixtures/sites/f1-161-rich-copy.synthetic.json'
      - '.github/workflows/sites-f1-161-rich-review-ui.yml'
permissions:
  contents: read
jobs:
  rich-review-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,xml,dom,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Lint route and strict local test
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticRichReviewUiTest.php
          php -r '$d=json_decode(file_get_contents("fixtures/sites/f1-161-rich-copy.synthetic.json"),true,16,JSON_THROW_ON_ERROR); if($d["schemaVersion"]!=="sites.ai-copy.v3")exit(1);'
      - name: Install locked Laravel fixtures without scripts
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Prove no route is registered with all lab flags off
        working-directory: apps/sites
        env:
          APP_ENV: testing
          SITES_SYNTHETIC_HTTP: '0'
          SITES_SYNTHETIC_REVIEW_UI: '0'
          SITES_SYNTHETIC_RICH_REVIEW: '0'
        run: |
          set -euo pipefail
          if php artisan route:list --path=_lab/sites/v1/rich-review --json | grep -q 'sites.lab.rich-review'; then
            echo "Rich review route unexpectedly registered by default" >&2
            exit 1
          fi
      - name: Test rich preview and legacy viewer in-process
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticRichReviewUiTest|SyntheticVisualReviewHttpTest|SyntheticReviewThemeSelectorTest)' --no-ansi
      - name: Never publish fixture
        if: always()
        run: echo "Only in-process CLI/test Laravel; no public HTTP, customer, CRM, deployment or real approval."
