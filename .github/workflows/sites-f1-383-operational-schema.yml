name: Sites F1-383 versioned operational PG18 schema - safe default-deny only
on:
  push:
    branches:
      - feature/sites-f1-383-versioned-pg-operational-schema-2026-11-13
  pull_request:
    paths:
      - 'apps/sites/database/migrations/**'
      - 'tests/f383-operational-schema-migration.php'
      - '.github/workflows/sites-f1-383-operational-schema.yml'
      - 'docs/SITES-F1-383-VERSIONED-PG18-CORE-SCHEMA.md'
permissions:
  contents: read
jobs:
  migrate-rollback-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f383-fictional-admin-only
          POSTGRES_DB: sites_f383_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f383_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      GITHUB_ACTIONS: 'true'
      SITES_F383_PG_MIGRATION_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sites_f383_lab
      DB_USERNAME: postgres
      DB_PASSWORD: f383-fictional-admin-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,dom,xml,pdo,pdo_pgsql
          coverage: none
      - name: Validate Laravel migration and fixture syntax
        run: |
          set -euo pipefail
          php -l apps/sites/database/migrations/2026_11_14_000001_create_sites_core_foundation.php
          php -l tests/f383-operational-schema-migration.php
      - name: Install locked Laravel dependencies
        working-directory: apps/sites
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Migrate default-deny operational schema into disposable PG18
        working-directory: apps/sites
        run: |
          set -euo pipefail
          php artisan migrate --force --no-ansi
          php artisan migrate:status --no-ansi
      - name: Adversarial schema test of RLS, cross-tenant FK and blocked release
        run: |
          set -euo pipefail
          if SITES_F383_PG_MIGRATION_LAB=0 php tests/f383-operational-schema-migration.php; then
            echo 'Unsafe: core migration fixture ran without CI flag'
            exit 1
          fi
          php tests/f383-operational-schema-migration.php
      - name: Prove Laravel migration rollback on isolated empty database
        working-directory: apps/sites
        run: |
          set -euo pipefail
          php artisan migrate:rollback --step=1 --force --no-ansi
          php -r '
            $db=new PDO("pgsql:host=127.0.0.1;dbname=sites_f383_lab",
              "postgres","f383-fictional-admin-only");
            $schemas=(int)$db->query(
              "SELECT count(*) FROM pg_namespace WHERE nspname="
              .chr(39)."sites_core".chr(39)
            )->fetchColumn();
            if($schemas!==0)exit(1);
            echo "F1-383 PASS: migration rollback dropped the schema in CI.";
          '
      - name: Release safety note
        if: always()
        run: |
          echo 'F1-383 CI database only: no production RLS grants, IAM or PSP. Release NO-GO.'
