name: Sites F1-383 versioned operational PG18 schema - safe default-deny only
on:
  push:
    branches:
      - feature/sites-f1-383-versioned-pg-operational-schema-2026-11-13
      - feature/sites-f1-384-tenant-safe-read-model-2026-11-14
      - feature/sites-f1-385-editorial-revision-api-2026-11-14
  pull_request:
    paths:
      - 'apps/sites/database/migrations/**'
      - 'apps/sites/bootstrap/app.php'
      - 'tests/f383-operational-schema-migration.php'
      - 'tests/f384-tenant-safe-operational-reader.php'
      - 'apps/sites/app/ReadModels/TenantSiteStatusReader.php'
      - 'apps/sites/tests/Feature/TenantSiteStatusReaderTest.php'
      - 'tests/f385-operational-editorial-revisions.php'
      - 'apps/sites/app/Editorial/EditorialRevisionWriter.php'
      - 'apps/sites/tests/Feature/EditorialRevisionWriterTest.php'
      - 'contracts/portal-sites/001-project-intake.sql'
      - 'contracts/portal-sites/003-project-intake-receipts.sql'
      - 'contracts/portal-sites/v1/project-intake-receipt.schema.json'
      - 'apps/sites/app/Integration/PortalProjectIntakeRecorder.php'
      - 'apps/sites/app/Integration/StoredProjectIntakeReceiptReader.php'
      - 'apps/sites/tests/Feature/PortalProjectIntakeRecorderTest.php'
      - 'apps/sites/tests/Feature/StoredProjectIntakeReceiptReaderTest.php'
      - 'tests/portal-project-intake-pg-contract.php'
      - 'tests/fixtures/project-intake-receipt/**'
      - 'contracts/portal-sites/002-brief-snapshots.sql'
      - 'contracts/release-registry/005-brief-artifact-provenance.sql'
      - 'src/Production/Brief*.php'
      - 'apps/sites/app/Integration/*Brief*.php'
      - 'apps/sites/tests/**/*Brief*.php'
      - 'tests/portal-brief-snapshot-pg-contract.php'
      - 'docs/SITES-F1-385-OPERATIONAL-EDITORIAL.md'
      - '.github/workflows/sites-f1-383-operational-schema.yml'
      - 'docs/SITES-F1-383-VERSIONED-PG18-CORE-SCHEMA.md'
permissions:
  contents: read
jobs:
  migrate-rollback-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f383-fictional-admin-only
          POSTGRES_DB: sites_f383_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f383_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      GITHUB_ACTIONS: 'true'
      SITES_F383_PG_MIGRATION_LAB: '1'
      SITES_F384_READER_LAB: '1'
      SITES_F385_EDITORIAL_LAB: '1'
      SITES_PROJECT_INTAKE_TESTS: '1'
      SITES_PROJECT_INTAKE_RECEIPT_TESTS: '1'
      SITES_BRIEF_SNAPSHOT_TESTS: '1'
      SITES_BRIEF_PROVENANCE_SCHEMA_TESTS: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sites_f383_lab
      DB_USERNAME: postgres
      DB_PASSWORD: f383-fictional-admin-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,dom,xml,pdo,pdo_pgsql
          coverage: none
      - name: Validate Laravel migration and fixture syntax
        run: |
          set -euo pipefail
          php -l apps/sites/database/migrations/2026_11_14_000001_create_sites_core_foundation.php
          php -l tests/f383-operational-schema-migration.php
          php -l apps/sites/database/migrations/2026_11_14_000002_add_tenant_bound_read_api.php
          php -l tests/f384-tenant-safe-operational-reader.php
          php -l apps/sites/app/ReadModels/TenantSiteStatusReader.php
          php -l apps/sites/tests/Feature/TenantSiteStatusReaderTest.php
          php -l apps/sites/database/migrations/2026_11_14_000003_add_editorial_revision_api.php
          php -l tests/f385-operational-editorial-revisions.php
          php -l apps/sites/app/Editorial/EditorialRevisionWriter.php
          php -l apps/sites/tests/Feature/EditorialRevisionWriterTest.php
          php -l apps/sites/database/migrations/2026_11_18_000011_add_portal_project_intake.php
          php -l apps/sites/app/Integration/PortalProjectIntakeRecorder.php
          php -l apps/sites/tests/Feature/PortalProjectIntakeRecorderTest.php
          php -l tests/portal-project-intake-pg-contract.php
          php -l apps/sites/database/migrations/2026_11_18_000013_add_portal_brief_snapshots.php
          php -l apps/sites/database/migrations/2026_11_18_000014_add_brief_artifact_provenance.php
          php -l apps/sites/database/migrations/2026_11_18_000015_add_portal_project_intake_reader.php
          php -l apps/sites/app/Integration/StoredProjectIntakeReceiptReader.php
          php -l apps/sites/tests/Feature/StoredProjectIntakeReceiptReaderTest.php
          php -l tests/fixtures/project-intake-receipt/contract.php
          php -l src/Production/BriefCandidateJson.php
          php -l src/Production/BriefSnapshotInput.php
          php -l src/Production/BriefRenderProvenance.php
          php -l apps/sites/app/Integration/BriefSnapshotTransaction.php
          php -l apps/sites/app/Integration/PortalBriefSnapshotRecorder.php
          php -l apps/sites/app/Integration/StoredBriefSnapshotReader.php
          php -l apps/sites/app/Integration/StoredBriefRendering.php
          php -l tests/portal-brief-snapshot-pg-contract.php
      - name: Install locked Laravel dependencies
        working-directory: apps/sites
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Migrate default-deny operational schema into disposable PG18
        working-directory: apps/sites
        run: |
          set -euo pipefail
          php artisan migrate --force --no-ansi
          php artisan migrate:status --no-ansi
      - name: Adversarial schema test of RLS, cross-tenant FK and blocked release
        run: |
          set -euo pipefail
          if SITES_F383_PG_MIGRATION_LAB=0 php tests/f383-operational-schema-migration.php; then
            echo 'Unsafe: core migration fixture ran without CI flag'
            exit 1
          fi
          php tests/f383-operational-schema-migration.php
      - name: F1-384 verify role-bound SQL tenant status isolation and revocation
        run: |
          set -euo pipefail
          if SITES_F384_READER_LAB=0 php tests/f384-tenant-safe-operational-reader.php; then
            echo 'Unsafe: F1-384 fixture ran without GitHub CI opt-in'
            exit 1
          fi
          php tests/f384-tenant-safe-operational-reader.php
      - name: F1-384 validate Laravel status reader with real restricted PG18 roles
        working-directory: apps/sites
        # The default offline phpunit.xml deliberately forces a disconnected DB.
        # This explicit CI fixture must retain the guarded job DB environment;
        # a skipped/warning test is not evidence of the restricted SQL adapter.
        run: php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --do-not-cache-result --fail-on-skipped --fail-on-warning tests/Feature/TenantSiteStatusReaderTest.php
      - name: F1-385 verify SQL editor/reviewer duties and durable revision CAS
        run: |
          set -euo pipefail
          if SITES_F385_EDITORIAL_LAB=0 php tests/f385-operational-editorial-revisions.php; then
            echo 'Unsafe: editorial fixture ran without explicit CI-only flag'
            exit 1
          fi
          php tests/f385-operational-editorial-revisions.php
      - name: F1-385 run Laravel editorial writer integration against PG18
        working-directory: apps/sites
        run: php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --do-not-cache-result --fail-on-skipped --fail-on-warning tests/Feature/EditorialRevisionWriterTest.php
      - name: Native pending intake through the application service and native schema
        env:
          SITES_PROJECT_INTAKE_RECEIPT_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$SITES_PROJECT_INTAKE_RECEIPT_PG_CONTAINER"
          DB_SERVER_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$SITES_PROJECT_INTAKE_RECEIPT_PG_CONTAINER")"
          export DB_SERVER_ADDRESS
          if SITES_PROJECT_INTAKE_TESTS=0 php tests/portal-project-intake-pg-contract.php; then
            echo 'Unsafe: native intake test ran without disposable database opt-in'
            exit 1
          fi
          if SITES_PROJECT_INTAKE_RECEIPT_TESTS=0 php tests/fixtures/project-intake-receipt/contract.php; then
            echo 'Unsafe: native intake receipt test ran without its own opt-in'
            exit 1
          fi
          php tests/portal-project-intake-pg-contract.php | tee "$RUNNER_TEMP/sites-native-project-intake.log"
          grep -q '^PASS native Portal project intake: 65 checks;' "$RUNNER_TEMP/sites-native-project-intake.log"
          grep -q '^NATIVE PROJECT INTAKE RECEIPT CI PASS: 53 new checks; 65 existing checks retained;' "$RUNNER_TEMP/sites-native-project-intake.log"
          cd apps/sites
          php vendor/bin/phpunit --do-not-cache-result --fail-on-warning tests/Feature/PortalProjectIntakeRecorderTest.php
          php vendor/bin/phpunit --do-not-cache-result --fail-on-warning tests/Feature/StoredProjectIntakeReceiptReaderTest.php
      - name: Candidate briefing snapshots through native receipt, exact read and existing renderer
        env:
          SITES_BRIEF_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$SITES_BRIEF_PG_CONTAINER"
          # The loopback host port forwards to this job's exact service address.
          # The fixture requires one explicit IPv4 and compares it with the server.
          DB_SERVER_ADDRESS="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$SITES_BRIEF_PG_CONTAINER")"
          export DB_SERVER_ADDRESS
          if SITES_BRIEF_SNAPSHOT_TESTS=0 php tests/portal-brief-snapshot-pg-contract.php; then
            echo 'Unsafe: briefing snapshot test ran without disposable database opt-in'
            exit 1
          fi
          php tests/portal-brief-snapshot-pg-contract.php | tee "$RUNNER_TEMP/sites-native-brief-snapshots.log"
          grep -Eq '^PASS native Portal brief snapshots: [1-9][0-9]* checks;' "$RUNNER_TEMP/sites-native-brief-snapshots.log"
          grep -q '^NATIVE BRIEF SNAPSHOTS CI PASS' "$RUNNER_TEMP/sites-native-brief-snapshots.log"
      - name: Prove Laravel migration rollback after isolated product fixtures
        working-directory: apps/sites
        run: |
          set -euo pipefail
          # The batch includes both native ledgers, provenance and the additive receipt reader.
          php -r '
            $db=new PDO("pgsql:host=127.0.0.1;dbname=sites_f383_lab",
              "postgres","f383-fictional-admin-only");
            $count=(int)$db->query("SELECT count(*) FROM migrations WHERE batch=1")->fetchColumn();
            if($count!==15)exit(1);
            echo "F1-383 PASS: exactly 15 migrations in the disposable batch.\n";
          '
          php artisan migrate:rollback --batch=1 --force --no-ansi
          php -r '
            $db=new PDO("pgsql:host=127.0.0.1;dbname=sites_f383_lab",
              "postgres","f383-fictional-admin-only");
            $schemas=(int)$db->query(
              "SELECT count(*) FROM pg_namespace WHERE nspname IN ("
              .chr(39)."sites_core".chr(39).",".chr(39)."sites_publication".chr(39).")"
            )->fetchColumn();
            if($schemas!==0)exit(1);
            echo "F1-383 PASS: migration rollback dropped both owned schemas in CI.";
          '
      - name: Release safety note
        if: always()
        run: |
          echo 'F1-383 CI database only: no production RLS grants, IAM or PSP. Release NO-GO.'
