name: Sites F1-79 append-only review evidence ledger - disposable PG18
on:
  pull_request:
    paths:
      - 'labs/security/f1-79-internal-review-ledger.sql'
      - 'src/Persistence/LabInternalReviewDecisionStore.php'
      - 'src/Production/SyntheticInternalReviewDecision.php'
      - 'src/Production/SyntheticInternalReviewDossier.php'
      - 'tests/f79-pg-internal-review-ledger.php'
      - 'src/Persistence/LabPersistedReviewEvidence.php'
      - 'tests/f80-pg-review-readback.php'
      - 'src/Application/LabEvidenceBoundReviewProposal.php'
      - 'tests/f81-pg-evidence-review-proposal.php'
      - 'src/Persistence/LabReviewLedgerCheckpoint.php'
      - 'tests/f82-pg-restore-checkpoint.php'
      - '.github/workflows/sites-f1-79-review-ledger.yml'
      - 'docs/SITES-F1-79-PG-REVIEW-LEDGER.md'
permissions:
  contents: read
jobs:
  append-only-review-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f79-lab-ephemeral-fixture-only
          POSTGRES_DB: sites_f79_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f79_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SITES_F79_PG_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: f79-lab-ephemeral-fixture-only
      PGDATABASE: sites_f79_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo,pdo_pgsql,mbstring,dom,xml
          coverage: none
      - name: Check PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Load disposable tenant RLS append-only ledger
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-79-internal-review-ledger.sql
      - name: Verify PHP syntax and evidence ledger isolation and concurrency
        run: |
          php -l src/Persistence/LabInternalReviewDecisionStore.php
          php -l tests/f79-pg-internal-review-ledger.php
          php tests/f79-pg-internal-review-ledger.php
          php -l src/Persistence/LabPersistedReviewEvidence.php
          php -l tests/f80-pg-review-readback.php
          php tests/f80-pg-review-readback.php
          php -l src/Application/LabEvidenceBoundReviewProposal.php
          php -l tests/f81-pg-evidence-review-proposal.php
          php tests/f81-pg-evidence-review-proposal.php
          php -l src/Persistence/LabReviewLedgerCheckpoint.php
          php -l tests/f82-pg-restore-checkpoint.php
      - name: Capture external checkpoint and logical backup in PG18
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          php tests/f82-pg-restore-checkpoint.php baseline
          test -n "$PG_CONTAINER"
          docker exec -e PGPASSWORD=f79-lab-ephemeral-fixture-only "$PG_CONTAINER" \
            pg_dump -U postgres -d sites_f79_lab -n review_f79 -Fc \
            > "$RUNNER_TEMP/sites-f82-before-append.dump"
          test -s "$RUNNER_TEMP/sites-f82-before-append.dump"
      - name: Append decision after backup and create a newer external anchor
        run: |
          set -euo pipefail
          php tests/f82-pg-restore-checkpoint.php append
          php tests/f82-pg-restore-checkpoint.php extended
      - name: Restore stale logical backup and DENY rollback against newer anchor
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          docker exec -i -e PGPASSWORD=f79-lab-ephemeral-fixture-only "$PG_CONTAINER" \
            pg_restore -U postgres -d sites_f79_lab --clean --if-exists --no-owner \
            < "$RUNNER_TEMP/sites-f82-before-append.dump"
          php tests/f82-pg-restore-checkpoint.php restored
          rm -f "$RUNNER_TEMP/sites-f82-before-append.dump" \
            /tmp/sites-f82-baseline-anchor.json /tmp/sites-f82-extended-anchor.json
      - name: Restriction notice
        if: always()
        run: echo 'F1-79 disposable fictional PG18 lab only. Not service IAM, backup-revocation proof, Portal acceptance or deployment.'
