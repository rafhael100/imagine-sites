name: Sites F1-377 CI signed HTTP ingress through Laravel/Nginx to private PG18
on:
  push:
    branches:
      - feature/sites-f1-378-portal-pinned-http-candidate-2026-11-13
      - feature/sites-f1-380-portal-pg-orders-http-2026-11-13
      - feature/sites-f1-381-admitted-project-review-preview-2026-11-13
      - feature/sites-f1-382-durable-editorial-review-2026-11-13
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/bootstrap/app.php'
      - 'apps/sites/app/Labs/**'
      - 'tests/f377-http-laravel-pg18-ci.php'
      - 'tests/f378-pinned-portal-http-to-sites.php'
      - 'tests/f380-rolebound-portal-pg-to-sites-http.php'
      - 'tests/f381-write-private-review-artifacts.php'
      - 'tests/fixtures/f381-tenant-review-read.sql'
      - 'tests/f382-run-role-separated-review.php'
      - 'tests/fixtures/f382-durable-editorial-review.sql'
      - 'docs/SITES-F1-382-DURABLE-EDITORIAL-REVIEW.md'
      - 'apps/sites/app/Labs/LaravelAdmittedPreviewLab.php'
      - 'apps/sites/routes/console.php'
      - 'docs/SITES-F1-381-ADMITTED-VISUAL-REVIEWS.md'
      - 'docs/SITES-F1-378-PORTAL-PINNED-HTTP.md'
      - 'ops/homologation/**'
      - '.github/workflows/sites-f1-377-http-laravel-pg18.yml'
      - 'docs/SITES-F1-377-REAL-HTTP-ADMISSION-LAB.md'
permissions:
  contents: read
jobs:
  signed-http-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SITES_F376_CI_LAB: '1'
      SITES_F377_CI_HTTP_LAB: '1'
      SITES_F380_PORTAL_DB_LAB: '1'
      SITES_F381_REVIEW_LAB: '1'
      SITES_F382_REVIEW_LAB: '1'
      APP_ENV: testing
      SITES_STAGING_APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    services:
      portal_purchase_pg:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_purchase_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_purchase_rehearsal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          path: portal-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 516dc99c24961e58ec769464c9dd862bf7ac8eda
          path: portal-purchase
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: curl,pdo_pgsql
          coverage: none
      - name: PHP syntax and CI-only config gates
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/app/Labs/LaravelSignedAdmissionLab.php
          php -l apps/sites/app/Labs/CIHttpPortalAuthority.php
          php -l tests/f377-http-laravel-pg18-ci.php
          php -l tests/f378-pinned-portal-http-to-sites.php
          php -l tests/f380-rolebound-portal-pg-to-sites-http.php
          php -l tests/f381-write-private-review-artifacts.php
          php -l tests/f382-run-role-separated-review.php
          php -l apps/sites/app/Labs/LaravelAdmittedPreviewLab.php
          php -l apps/sites/routes/console.php
          test "$(git -C portal-purchase rev-parse HEAD)" = 516dc99c24961e58ec769464c9dd862bf7ac8eda
          test "$(git -C portal-candidate rev-parse HEAD)" = bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          base=ops/homologation/compose.yaml
          db=ops/homologation/compose.ci-pg18.yaml
          ci=ops/homologation/compose.ci-http.yaml
          orders=ops/homologation/compose.ci-portal-orders.yaml
          reviews=ops/homologation/compose.ci-reviews.yaml
          editorial=ops/homologation/compose.ci-editorial.yaml
          if SITES_F377_CI_HTTP_LAB= docker compose -f "$base" -f "$db" -f "$ci" -f "$orders" -f "$reviews" -f "$editorial" config --quiet; then
            echo 'Unsafe: CI HTTP overlay accepted missing opt-in'
            exit 1
          fi
          docker compose -f "$base" -f "$db" -f "$ci" -f "$orders" -f "$reviews" -f "$editorial" config --quiet
          docker compose -f "$base" -f "$db" -f "$ci" -f "$orders" -f "$reviews" -f "$editorial" config --format json |
            php -r '
              $c=json_decode(stream_get_contents(STDIN),true,64,JSON_THROW_ON_ERROR);
              $s=$c["services"]??[];
              if(isset($s["sites-db"]["ports"]) || isset($s["sites-php"]["ports"]))exit(1);
              if(($s["sites-proxy"]["ports"][0]["host_ip"]??"")!=="127.0.0.1")exit(1);
              if(($s["sites-php"]["environment"]["APP_ENV"]??"")!=="testing")exit(1);
              if(($c["networks"]["sites-internal"]["internal"]??null)!==true)exit(1);
            '
      - name: Initialize real Portal candidate persisted purchase schema, RLS, and roles
        run: |
          set -euo pipefail
          php portal-purchase/apps/portal/tools/test_persisted_purchase.php
      - name: Start private PostgreSQL18 and PHP FPM with CI HTTP gate CLOSED
        run: |
          set -euo pipefail
          if ! SITES_F377_CI_HTTP_LAB=0 docker compose \
            -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml up -d --build; then
            docker compose -f ops/homologation/compose.yaml \
              -f ops/homologation/compose.ci-pg18.yaml \
              -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml logs --tail=90
            exit 1
          fi
      - name: Verify actual HTTP route is 404 when CI HTTP opt-in is false
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 40); do
            if curl --noproxy '*' -fsS --output /dev/null http://127.0.0.1:18081/up; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:18081/_ci/sites/v1/admit)" = 404
          test "$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:18081/_lab/sites/v1/create-project)" = 404
      - name: Activate isolated CI-only PHP-FPM route without exposing ports
        run: |
          set -euo pipefail
          SITES_F377_CI_HTTP_LAB=1 docker compose \
            -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml \
            up -d --no-deps --force-recreate sites-php
          for i in $(seq 1 20); do
            if curl --noproxy '*' -fsS --output /dev/null http://127.0.0.1:18081/up; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Signed Onepage and Landing HTTP POST across Nginx FPM and real PG18
        run: |
          set -euo pipefail
          if SITES_F377_CI_HTTP_LAB=0 php tests/f377-http-laravel-pg18-ci.php; then
            echo 'Unsafe: CI-only HTTP client ran without gate'
            exit 1
          fi
          if ! php tests/f377-http-laravel-pg18-ci.php; then
            docker compose -f ops/homologation/compose.yaml \
              -f ops/homologation/compose.ci-pg18.yaml \
              -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml logs --tail=70
            exit 1
          fi
      - name: Actual pinned Portal encoder and signer to Sites HTTP and PG18
        env:
          SITES_F378_PINNED_PORTAL_LAB: '1'
        run: |
          set -euo pipefail
          export SITES_F378_PORTAL_PATH="$GITHUB_WORKSPACE/portal-candidate"
          if SITES_F378_PINNED_PORTAL_LAB=0 php tests/f378-pinned-portal-http-to-sites.php; then
            echo 'Unsafe: pinned Portal client admitted without CI-only opt-in'
            exit 1
          fi
          php tests/f378-pinned-portal-http-to-sites.php
      - name: Portal restricted SQL purchase rows to signed Sites HTTP and private PG18
        env:
          SITES_F380_PORTAL_PURCHASE_PATH: ${{ github.workspace }}/portal-purchase
          SITES_F380_PORTAL_SIGNER_PATH: ${{ github.workspace }}/portal-candidate
        run: |
          set -euo pipefail
          if SITES_F380_PORTAL_DB_LAB=0 php tests/f380-rolebound-portal-pg-to-sites-http.php; then
            echo 'Unsafe: portal-purchase bridge not explicitly scoped to CI'
            exit 1
          fi
          php tests/f380-rolebound-portal-pg-to-sites-http.php
      - name: Independently assert durable PG18 tenant/outbox/nonce results
        run: |
          set -euo pipefail
          query() {
            docker compose -f ops/homologation/compose.yaml \
              -f ops/homologation/compose.ci-pg18.yaml \
              -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml \
              exec -T sites-db psql -X -U postgres -d sites_f360_lab -tA -v ON_ERROR_STOP=1 -c "$1" | tr -d '\r\n'
          }
          test "$(query "SELECT count(*) FROM sites_f360.admissions WHERE operation_ref LIKE 'idem-f377-%'")" = 3
          test "$(query "SELECT count(*) FROM sites_f360.outbox WHERE operation_ref LIKE 'idem-f377-%'")" = 3
          test "$(query "SELECT count(*) FROM sites_f360.replay_nonces WHERE nonce LIKE 'nonce-f377-%'")" = 5
          test "$(query "SELECT count(*) FROM sites_f360.admissions WHERE operation_ref='failoutbox-f360'")" = 0
          test "$(query "SELECT count(*) FROM sites_f360.outbox WHERE operation_ref='failoutbox-f360'")" = 0
          test "$(query "SELECT count(*) FROM sites_f360.admissions WHERE tenant_ref='tenant-f360-a'")" = 0
          test "$(query "SELECT count(*) FROM sites_f360.admissions WHERE operation_ref LIKE 'idem-f378-%'")" = 2
          test "$(query "SELECT count(*) FROM sites_f360.outbox WHERE operation_ref LIKE 'idem-f378-%'")" = 2
          test "$(query "SELECT count(*) FROM sites_f360.replay_nonces WHERE nonce LIKE 'nonce-f378-%'")" = 4
          test "$(query "SELECT count(*) FROM sites_f360.admissions WHERE operation_ref LIKE 'idem-f380-%'")" = 2
          test "$(query "SELECT count(*) FROM sites_f360.outbox WHERE operation_ref LIKE 'idem-f380-%'")" = 2
          test "$(query "SELECT count(*) FROM sites_f360.replay_nonces WHERE nonce LIKE 'nonce-f380-%'")" = 4
          echo 'F1-377 PASS: three atomic projects and outbox events, five durable nonces, no cross-tenant or failed outbox rows.'
      - name: F1-381 ensure DB-review projection respects authenticated tenant roles
        run: |
          set -euo pipefail
          docker compose -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml exec -T sites-php php -r '
              $dsn="pgsql:host=sites-db;port=5432;dbname=sites_f360_lab";
              $opts=[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION];
              $b=new PDO($dsn,"sites_f360_b","f360-fictional-tenant-b-only",$opts);
              $a=new PDO($dsn,"sites_f360_a","f360-fictional-tenant-a-only",$opts);
              $query="SELECT * FROM sites_f360.list_own_review_candidates()";
              $rs=$b->query($query)->fetchAll(PDO::FETCH_ASSOC);
              if(count($rs)!==2 ||
                 count($a->query($query)->fetchAll(PDO::FETCH_ASSOC))!==0)exit(1);
              $products=array_column($rs,"product_code");sort($products);
              if($products!==["landing_page","onepage"])exit(2);
              try{$b->query("SELECT * FROM sites_f360.admissions");exit(3);}
              catch(PDOException $e){if($e->getCode()!=="42501")exit(4);}
              echo "F1-381 PASS: two restricted Site reviews for tenant B, zero for A, no direct admissions SELECT.";
            '
      - name: F1-381 build private inert HTML previews from admitted Site rows
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f381-previews"
          if ! docker compose -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml \
            exec -T sites-php php artisan sites:admitted-review-fixture \
            > "$RUNNER_TEMP/f381-private.json"; then
            echo 'F1-381: HTML preview artifact builder failed (not publishable)'
            exit 1
          fi
          SITES_F381_BUNDLE_FILE="$RUNNER_TEMP/f381-private.json" \
          SITES_F381_REVIEW_DIR="$RUNNER_TEMP/f381-previews" \
          php tests/f381-write-private-review-artifacts.php
          test -s "$RUNNER_TEMP/f381-previews/index.html"
          test -s "$RUNNER_TEMP/f381-previews/preview-onepage.html"
          test -s "$RUNNER_TEMP/f381-previews/preview-landing-page.html"
          test -s "$RUNNER_TEMP/f381-previews/manifest.json"
          ! grep -Eiq 'tenant_ref|portal_purchase_rehearsal|password|sensitive|customerid' "$RUNNER_TEMP/f381-previews/manifest.json"
          rm -f -- "$RUNNER_TEMP/f381-private.json"
      - name: F1-382 persist separate editor and reviewer decisions with DB CAS
        run: |
          set -euo pipefail
          docker compose -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml \
            exec -T sites-php php /run/f382-review-fixture.php \
            < "$RUNNER_TEMP/f381-previews/manifest.json" \
            > "$RUNNER_TEMP/f381-previews/editorial-review-evidence.json"
          php -r '
            $p=getenv("RUNNER_TEMP")."/f381-previews/editorial-review-evidence.json";
            $r=json_decode(file_get_contents($p),true,16,JSON_THROW_ON_ERROR);
            if(($r["schemaVersion"]??"")!=="sites.ci.editorial-review-evidence.v1" ||
               ($r["releaseGate"]??"")!=="NO_GO" ||
               ($r["canPublish"]??null)!==false ||
               ($r["clientAcceptanceVerified"]??null)!==false ||
               ($r["auditEvents"]??null)!==9 ||
               count($r["reviews"]??[])!==2)exit(1);
            foreach($r["reviews"] as $s)if(
              ($s["state"]??"")!=="awaiting_portal_acceptance" ||
              ($s["publishable"]??null)!==false ||
              ($s["clientAccepted"]??null)!==false)exit(1);
          '
          echo 'F1-382 PASS: separate restricted SQL roles, CAS revisions and immutable review audit; no client acceptance or publication.'
      - name: Upload only wholly-fictional navigable review previews
        uses: actions/upload-artifact@v4
        with:
          name: imagine-sites-f381-navigable-review-fixtures
          path: ${{ runner.temp }}/f381-previews/
          retention-days: 7
          if-no-files-found: error
      - name: Always destroy fictional database and HTTP containers
        if: always()
        run: |
          docker compose -f ops/homologation/compose.yaml \
            -f ops/homologation/compose.ci-pg18.yaml \
            -f ops/homologation/compose.ci-http.yaml \
            -f ops/homologation/compose.ci-portal-orders.yaml \
            -f ops/homologation/compose.ci-reviews.yaml \
            -f ops/homologation/compose.ci-editorial.yaml down --volumes --remove-orphans
