name: Sites Landing PG18 Portal head pair (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['integration/sites-landing-private-current-readback-2026-11-20-r16']
    paths:
      - '.github/workflows/sites-landing-pg18-portal-head-pair.yml'
      - 'tests/landing-page-pg18-portal-pair.php'
permissions:
  contents: read
concurrency:
  group: sites-landing-pg18-portal-head-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  pg18-portal-to-sites:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/sites-landing-pg18-portal-head-pair-2026-11-20-r17' &&
      github.event.pull_request.base.ref == 'integration/sites-landing-private-current-readback-2026-11-20-r16' &&
      github.event.pull_request.base.sha == 'acc935766ae385a04e37f29613008c8c09f6730a'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-portal
          ref: 3c3ba328111445394ad756b9a12507db393a62d1
          path: .pinned-portal
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none
      - name: Verify fixed Portal source and PHP syntax
        run: |
          set -euo pipefail
          test "$(git -C .pinned-portal rev-parse HEAD)" = 3c3ba328111445394ad756b9a12507db393a62d1
          php -l tests/landing-page-pg18-portal-pair.php
          php -l .pinned-portal/apps/portal/app/Domain/SitesIntegration/Pg18LandingPageApprovedBriefHeadSourceCandidate.php
          php -m | grep -x pdo_pgsql
      - name: Run real PG18 head-to-envelope-to-readback and offline regression
        run: |
          set -euo pipefail
          php tests/landing-page-pg18-portal-pair.php | tee sites-pg18-pair.log
          grep -Eq '^SITES LANDING PG18 PORTAL PAIR PASS: [0-9]+ checks;' sites-pg18-pair.log
          php tests/landing-page-private-current-readback-offline.php | tee sites-readback.log
          grep -Eq '^SITES LANDING PRIVATE CURRENT READBACK PASS: [0-9]+ checks;' sites-readback.log
