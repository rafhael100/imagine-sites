name: F1-25 capture receipt clock, immutable CRM binding and expiry purge - lab only

on:
  pull_request:
    paths:
      - 'labs/capture/f1-25-*'
      - 'labs/capture/f1-10-schema.sql'
      - '.github/workflows/sites-f1-25-clock-retention.yml'
      - 'docs/SITES-F1-25-CAPTURE-IMMUTABILITY.md'

permissions:
  contents: read

jobs:
  ingress-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ingress-f25-fictional-only
          POSTGRES_DB: sites_ingress_primary_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_ingress_primary_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ingress-f25-fictional-only
      PGDATABASE: sites_ingress_primary_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL CLI
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable ingress fixtures (no personal data)
        run: psql -X -v ON_ERROR_STOP=1 -f labs/capture/f1-10-schema.sql
      - name: Test caller time forgery, delivery immutability and expired cleanup
        run: psql -X -v ON_ERROR_STOP=1 -f labs/capture/f1-25-clock-and-retention-assertions.sql
      - name: Confirm across a separate DB client that metadata was removed
        run: |
          set -euo pipefail
          old=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM ingress.receipts WHERE submission_id='old-which-must-purge'")
          active=$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM ingress.receipts WHERE submission_id='fresh-server-stamped'")
          test "$old" = 0
          test "$active" = 1
      - name: No production infrastructure
        if: always()
        run: echo "Disposable PostgreSQL only; no payload, no real customer, not a global idempotency or disaster-recovery proof."
