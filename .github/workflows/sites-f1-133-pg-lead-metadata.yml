name: Sites F1-133 physical CRM lead metadata uniqueness - disposable PG18
on:
  pull_request:
    paths:
      - 'labs/postgres/f1-133-lead-metadata-ledger.sql'
      - 'tests/f133-pg-lead-idempotency.php'
      - 'src/Integration/LabPostgresCrmLeadMetadataReadback.php'
      - 'src/Integration/SyntheticCrmLeadMetadataReadbackAssessment.php'
      - 'docs/SITES-F1-134-READBACK-NO-DELIVERY-AUTHORITY.md'
      - 'src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php'
      - 'src/Integration/SyntheticCrmLeadLedgerIntentV1.php'
      - '.github/workflows/sites-f1-133-pg-lead-metadata.yml'
      - 'docs/SITES-F1-133-PHYSICAL-CRM-LEAD-IDEMPOTENCY.md'
permissions:
  contents: read
jobs:
  metadata-only-physical-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f133-fictional-admin-disposable-ci-only
          POSTGRES_DB: sites_f133_lead_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f133_lead_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      SITES_F133_LEAD_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: sites_f133_lead_lab
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sites_f133_lead_lab
      PGUSER: postgres
      PGPASSWORD: f133-fictional-admin-disposable-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          tools: none
          coverage: none
      - name: Require PostgreSQL client only on ephemeral CI
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Install isolated metadata-only table and restricted login
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-133-lead-metadata-ledger.sql
      - name: Verify safe CLI fixture and two independent PostgreSQL sessions
        run: |
          set -euo pipefail
          php -l src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php
          php -l src/Integration/SyntheticCrmLeadLedgerIntentV1.php
          php -l tests/f133-pg-lead-idempotency.php
          php -l src/Integration/LabPostgresCrmLeadMetadataReadback.php
          php -l src/Integration/SyntheticCrmLeadMetadataReadbackAssessment.php
          php tests/f133-pg-lead-idempotency.php
      - name: No runtime or lead delivery promotion
        if: always()
        run: echo "Disposable PG18 metadata-only uniqueness; no real lead, CAS API, ACK, IAM, LGPD, CRM, VPS or deploy."
