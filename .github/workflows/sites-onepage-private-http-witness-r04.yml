name: Sites OnePage private loopback HTTP witness R04 (CI only)
'on':
  pull_request:
    types: [opened, synchronize]
    branches: ['test/onepage-served-html-bytes-r03-2026-11-22']
    paths:
      - 'tests/onepage-final-acceptance-artifact-drift-offline.php'
      - 'tests/onepage-private-http-presentation-r04.php'
      - '.github/workflows/sites-onepage-private-http-witness-r04.yml'
      - 'docs/reviews/SITES-ONEPAGE-PRIVATE-HTTP-WITNESS-R04-2026-11-22.md'
permissions:
  contents: read
concurrency:
  group: sites-onepage-http-r04-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  isolated-loopback-http:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/onepage-private-http-witness-r04-2026-11-22' &&
      github.event.pull_request.base.ref == 'test/onepage-served-html-bytes-r03-2026-11-22' &&
      github.event.pull_request.base.sha == '4f12e16c6f9b39fcf4db8848e98842bcd1e23e88'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Check exact source scope and one-request private HTTP transport
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 - <<'PY'
          import subprocess
          expected = {
              'tests/onepage-final-acceptance-artifact-drift-offline.php',
              'tests/onepage-private-http-presentation-r04.php',
              '.github/workflows/sites-onepage-private-http-witness-r04.yml',
              'docs/reviews/SITES-ONEPAGE-PRIVATE-HTTP-WITNESS-R04-2026-11-22.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '4f12e16c6f9b39fcf4db8848e98842bcd1e23e88', 'HEAD'],
              text=True).splitlines())
          assert changed == expected, 'R04_SCOPE_REFUSED'
          PY
          php -l tests/onepage-private-http-presentation-r04.php
          php -l tests/onepage-final-acceptance-artifact-drift-offline.php
          php tests/onepage-private-http-presentation-r04.php | tee "$RUNNER_TEMP/onepage-r04.log"
          grep -Eq '^ONEPAGE R04 LOOPBACK HTTP PASS: [0-9]+ synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/onepage-r04.log"
          test ! -e .env.production
          test ! -e /run/secrets/imagine
