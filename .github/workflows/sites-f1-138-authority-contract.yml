name: Sites F1-138 synthetic binding authority boundary

on:
  pull_request:
    paths:
      - 'src/Integration/SyntheticLeadBindingAuthority*.php'
      - 'tests/f138-authority-source-contract.php'
      - '.github/workflows/sites-f1-138-authority-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Synthetic fail-closed tests (no DB or HTTP)
        run: |
          php -l src/Integration/SyntheticLeadBindingAuthoritySource.php
          php -l src/Integration/SyntheticLeadBindingAuthoritySnapshot.php
          php -l src/Integration/SyntheticLeadBindingAuthorityAssessment.php
          php -l src/Integration/SyntheticLeadBindingAuthorityPreflight.php
          php -l tests/f138-authority-source-contract.php
          php tests/f138-authority-source-contract.php
