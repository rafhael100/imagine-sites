name: Sites OnePage — revoke-first in disposable Sites TLS
'on':
  pull_request:
    types: [opened]
    branches: [test/sites-onepage-startup-stderr-probe-v6-2026-11-22]
    paths: [.github/workflows/sites-stage3-onepage-revoke-first-tls-ci.yml]
permissions:
  contents: read
concurrency:
  group: sites-stage3-onepage-revoke-first-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  attest:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.run_attempt == 1 &&
      github.event.repository.private == false &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'rafhael100' &&
      github.event.sender.login == 'rafhael100' &&
      github.event.pull_request.head.repo.full_name == 'rafhael100/imagine-sites' &&
      github.event.pull_request.base.repo.full_name == 'rafhael100/imagine-sites' &&
      github.event.pull_request.head.ref == 'test/sites-onepage-minimal-cli-bootstrap-v7-2026-11-22' &&
      github.event.pull_request.base.ref == 'test/sites-onepage-startup-stderr-probe-v6-2026-11-22' &&
      github.event.pull_request.base.sha == '5eee80aff555ee6317f5e198ec3c7a916188767f'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Attest fresh hosted runner and exact public source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          repo='rafhael100/imagine-sites'
          base='5eee80aff555ee6317f5e198ec3c7a916188767f'
          base_ref='test/sites-onepage-startup-stderr-probe-v6-2026-11-22'
          head_ref='test/sites-onepage-minimal-cli-bootstrap-v7-2026-11-22'
          workflow='.github/workflows/sites-stage3-onepage-revoke-first-tls-ci.yml'
          prefix='tests/fixtures/sites-onepage-terminal/'
          new={
              prefix+'acquire.sh':'e4d88f5b176898ae9cc2504d09a0671a0f50c3252684e1b5c4bb7c510b560f9d',
              prefix+'launcher.sh':'dde1596025ea6709e2da57d3e86c636fa6eb2a3d9f22353a7690a41f685a5720',
              prefix+'entrypoint.php':'4d31f67aeb654e4c230f3d6ac0a7956ac523aca5e63fd20484c593830d16894b',
              prefix+'owned_receipt.py':'d86556b6fb11162b43413e7f126e76ace15d17b0989966562387e56e7b23414e',
              prefix+'TlsAdmission.php':'c831c002226587c4cf19e15e2f7c39116b895e48276f98667d45a0ee47b96676',
              prefix+'Stage3ReceiptChannel.php':'ee5e124be0521f44af7114ecd291c262ae544e6e448371d34f065973536426ba',
              prefix+'scenario.php':'dfb31fda0f578f2c0bd4af15ff5e3f9b72de7c5fe52a0cb318bddaee45fa081c',
              prefix+'Machine.php':'036a5fed115c75f0103a934f383690b664f80814081ce7996288f6933d83a9b2',
              prefix+'Race.php':'5127576d711eed18d017bdb6a3e7883f9c9732c58dd44b0100f31b1ce2edd0bd',
              prefix+'schema.sql':'61f5a587b24d3d124596859a8411dd0d2b91a39d82a23e49894381050807c422',
          }
          inherited={
              'tests/fixtures/sites-stage3/Stage3ReceiptChannel.php':'ee5e124be0521f44af7114ecd291c262ae544e6e448371d34f065973536426ba',
          }
          def need(ok):
              if not ok: raise SystemExit('ONEPAGE_TERMINAL_OUTER_REFUSED')
          def fixed(cmd, *, env=None, timeout=8):
              x=subprocess.run(cmd,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
                               stderr=subprocess.DEVNULL,timeout=timeout)
              need(x.returncode==0)
              return x.stdout
          def public(source):
              return source['id']==1450805165 and source['full_name']==repo and source['private'] is False
          def git(*args):
              return fixed(['/usr/bin/git','-C',str(root),*args],env=git_env,timeout=90)
          def git_bytes(path,commit):
              p=root/path
              need(p.is_file() and p.resolve(strict=True)==p
                   and git('ls-tree',commit,'--',path).startswith(b'100644 blob '))
              data=p.read_bytes()
              need(data==git('show',commit+':'+path))
              return data
          try:
              if not all(re.fullmatch('[0-9a-f]{64}',h) for h in new.values()):
                  raise SystemExit('ONEPAGE_TERMINAL_UNREVIEWED_SCENARIO')
              e=os.environ
              need(all(e.get(k)==v for k,v in {
                  'GITHUB_ACTIONS':'true','GITHUB_EVENT_NAME':'pull_request','GITHUB_RUN_ATTEMPT':'1',
                  'GITHUB_REPOSITORY':repo,'RUNNER_ENVIRONMENT':'github-hosted','RUNNER_OS':'Linux','RUNNER_ARCH':'X64',
              }.items()))
              denied={'GITHUB_TOKEN','GH_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL',
                      'SSH_AUTH_SOCK','GIT_CONFIG_COUNT','GIT_ASKPASS','COMPOSER_AUTH','PGPASSWORD',
                      'PGHOST','PGHOSTADDR','PGSERVICE','PGPASSFILE','DATABASE_URL','DB_PASSWORD',
                      'AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN','OPENAI_API_KEY'}
              need(denied.isdisjoint(e))
              need(os.getuid()==os.geteuid()!=0 and os.uname().machine=='x86_64')
              release=set(pathlib.Path('/etc/os-release').read_text().splitlines())
              need({'ID=ubuntu','VERSION_ID="24.04"'}<=release)
              root=pathlib.Path(e['GITHUB_WORKSPACE'])
              rt=pathlib.Path(e['RUNNER_TEMP'])
              need(root.is_absolute() and root.resolve(strict=True)==root==pathlib.Path.cwd()
                   and root.is_dir() and root.stat().st_uid==os.getuid() and not any(root.iterdir()))
              need(rt.is_absolute() and rt.resolve(strict=True)==rt and rt.is_dir()
                   and rt.stat().st_uid==os.getuid() and not any(rt.glob('sites-terminal-acquire.*'))
                   and not any(rt.glob('sites-terminal-outer.*')) and not any(pathlib.Path('/tmp').glob('sites-release-registry-*')))
              need(subprocess.run(['/usr/bin/pgrep','-x','postgres'],stdin=subprocess.DEVNULL,
                                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5).returncode==1)
              cap=r'''
          import fcntl, os
          status=dict(line.split(':',1) for line in open('/proc/self/status') if ':' in line)
          required=(1<<12)|(1<<19)|(1<<21) # NET_ADMIN, SYS_PTRACE, SYS_ADMIN
          assert os.getuid()==os.geteuid()==0 and int(status['CapEff'],16)&required==required
          fd=os.memfd_create('stage3-capability-only',os.MFD_CLOEXEC|os.MFD_ALLOW_SEALING)
          try:
              seals=fcntl.F_SEAL_WRITE|fcntl.F_SEAL_GROW|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_SEAL
              fcntl.fcntl(fd,fcntl.F_ADD_SEALS,seals)
              assert fcntl.fcntl(fd,fcntl.F_GET_SEALS)==seals
          finally:
              os.close(fd)
          '''
              fixed(['/usr/bin/sudo','-n','/usr/bin/env','-i','PATH=/usr/sbin:/usr/bin:/sbin:/bin','LC_ALL=C',
                     '/usr/bin/python3','-I','-B','-c',cap])
              need(fixed(['/usr/bin/openssl','version']).startswith(b'OpenSSL 3.'))
              event=json.loads(pathlib.Path(e['GITHUB_EVENT_PATH']).read_bytes())
              pr=event['pull_request']
              number=event['number']
              need(e['GITHUB_ACTOR']=='rafhael100' and event['sender']['login']=='rafhael100'
                   and pr['user']['login']=='rafhael100' and pr['author_association']=='OWNER')
              need(type(number) is int and number>0 and pr['number']==number and event['action']=='opened'
                   and public(event['repository']) and public(pr['head']['repo']) and public(pr['base']['repo'])
                   and pr['state']=='open' and pr['draft'] is True and pr['head']['ref']==head_ref
                   and pr['base']['ref']==base_ref and pr['base']['sha']==base)
              head=pr['head']['sha']
              merge=e['GITHUB_SHA']
              pr_ref=f'refs/pull/{number}/merge'
              need(re.fullmatch('[0-9a-f]{40}',head) and head!=base and re.fullmatch('[0-9a-f]{40}',merge)
                   and e['GITHUB_REF']==pr_ref and e['GITHUB_WORKFLOW_REF']==f'{repo}/{workflow}@{pr_ref}'
                   and e['GITHUB_WORKFLOW_SHA']==merge)
              git_env={'PATH':'/usr/bin:/bin','LC_ALL':'C','HOME':'/nonexistent',
                       'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_TERMINAL_PROMPT':'0'}
              git('init','--quiet','--template=')
              git('-c','credential.helper=','-c','http.followRedirects=false','fetch','--quiet','--no-tags',
                  '--depth=3','https://github.com/rafhael100/imagine-sites.git',pr_ref,head,base)
              def parents(commit):
                  return [ln[7:].decode() for ln in git('cat-file','commit',commit).split(b'\n\n',1)[0].splitlines()
                          if ln.startswith(b'parent ')]
              need(parents(head)==[base] and parents(merge)==[base,head])
              git('checkout','--quiet','--detach',head)
              need(git('rev-parse','HEAD').strip().decode()==head)
              allowed={prefix+'scenario.php',workflow}
              fields=git('diff','--no-renames','--name-status','-z',base,head).split(b'\0')
              need(fields[-1:]==[b''] and len(fields)==1+2*len(allowed)
                   and {(fields[i],fields[i+1].decode()) for i in range(0,len(fields)-1,2)}
                       =={(b'M',p) for p in allowed})
              for path,digest in {**new,**inherited}.items():
                  need(hashlib.sha256(git_bytes(path,head)).hexdigest()==digest)
                  if path in inherited: need(git('show',base+':'+path)==git('show',head+':'+path))
              need(git_bytes(prefix+'Stage3ReceiptChannel.php',head)==
                   git('show',base+':tests/fixtures/sites-stage3/Stage3ReceiptChannel.php'))
              need(git_bytes(workflow,head)==git('show',merge+':'+workflow))
              need(git('rev-parse',merge+'^{tree}')==git('rev-parse',head+'^{tree}'))
              need(git('status','--porcelain=v1','--untracked-files=all')==b'')
          except (KeyError, OSError, ValueError, TypeError, subprocess.SubprocessError):
              raise SystemExit('ONEPAGE_TERMINAL_OUTER_REFUSED') from None
          print('ONEPAGE_TERMINAL_OUTER_HOST_AND_PINS_OK')
          PY
      - name: Prove revoke-first with TLS on one owned disposable Sites database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C
          die() { printf 'ONEPAGE_TERMINAL_JOB_REFUSED %s\n' "$1" >&2; exit 1; }
          empty_pg() { if pgrep -x postgres >/dev/null; then die EXISTING_POSTGRES; else [[ $? = 1 ]] || die PROCESS_CHECK; fi; }
          empty_pg
          work=$(mktemp -d "$RUNNER_TEMP/sites-terminal-outer.XXXXXXXX")
          passed=false
          cleanup_outer() {
            rc=$?
            trap - EXIT
            trap '' INT TERM
            # A live or unclassifiable postmaster is the separate supervisor's
            # responsibility. Do not erase its inputs or claim cleanup.
            if pgrep -x postgres >/dev/null; then
              die OUTER_CLEANUP_POSTMASTER_UNPROVED
            else
              [[ $? = 1 ]] || die OUTER_CLEANUP_PROCESS_CHECK
            fi
            [[ ${work%/*} = "$RUNNER_TEMP" && ${work##*/} =~ ^sites-terminal-outer\.[[:alnum:]]{8}$ &&
               ! -L $work && -d $work && -O $work && $(realpath -e -- "$work") = "$work" ]] || die CLEANUP_SCRATCH_PATH
            rm -rf -- "$work" || die CLEANUP_SCRATCH
            [[ ! -e $work && ! -L $work ]] || die CLEANUP_SCRATCH
            if ((rc==0)) && $passed; then
              printf 'ONEPAGE_TERMINAL_WORKFLOW_AND_CLEANUP_OK\n'
            else
              printf 'ONEPAGE_TERMINAL_OUTER_SCRATCH_REMOVED\n'
              ((rc!=0)) || rc=1
            fi
            exit "$rc"
          }
          [[ ${work%/*} = "$RUNNER_TEMP" && ${work##*/} =~ ^sites-terminal-outer\.[[:alnum:]]{8}$ &&
             ! -L $work && -d $work && -O $work ]] || die SCRATCH
          trap cleanup_outer EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # APT sandbox may traverse only the dedicated acquisition parent.
          # Nest acquisition under owned scratch so a malformed/no receipt
          # cannot strand a second folder outside the outer cleanup boundary.
          chmod 0711 -- "$work"
          acq_parent="$work/acquire"
          mkdir -m 0711 -- "$acq_parent"
          mkdir -m 0700 -- "$work/home" "$work/logs"
          receipt_parent=$(mktemp -d "$acq_parent/sites-terminal-outer.XXXXXXXX")
          : >"$receipt_parent/acquisition.receipt"
          env -i PATH="$PATH" LC_ALL=C HOME="$work/home" RUNNER_TEMP="$acq_parent" \
            GITHUB_ACTIONS=true GITHUB_EVENT_NAME=pull_request GITHUB_RUN_ATTEMPT=1 GITHUB_REPOSITORY=rafhael100/imagine-sites \
            ONEPAGE_TERMINAL_ACQUIRE_RECEIPT="$receipt_parent/acquisition.receipt" \
            bash tests/fixtures/sites-onepage-terminal/acquire.sh >"$work/logs/acquisition.log" 2>&1 || die ACQUISITION
          [[ $(stat -c %s -- "$work/logs/acquisition.log") -le 32768 ]] || die ACQUISITION_LOG_BOUND
          grep -Ex 'STAGE2_PG_ELF_CLOSURE_OK [0-9]{1,2}_PLUS_PGCRYPTO' "$work/logs/acquisition.log" || die PG_LOADER_SEAL
          [[ $(grep -Fxc 'STAGE2_LOCKED_SOURCES_OK 75' "$work/logs/acquisition.log") = 1 ]] || die COMPOSER_RECEIPT
          mapfile -t receipt <"$receipt_parent/acquisition.receipt"
          [[ ${#receipt[@]} = 2 && ${receipt[0]} = ONEPAGE_TERMINAL_SITES_ROOT=* &&
             ${receipt[1]} = ONEPAGE_TERMINAL_RUNTIME_DIR=* ]] || die ACQUISITION_RECEIPT
          sites=${receipt[0]#*=}
          runtime=${receipt[1]#*=}
          dir=${runtime%/*}
          [[ ${dir%/*} = "$acq_parent" && ${dir##*/} =~ ^sites-terminal-acquire\.[[:alnum:]]{8}$ &&
             $runtime = "$dir/runtime" && $sites = "$dir/sites-541" &&
             ! -L $dir && -O $dir && $(stat -c %a -- "$dir") = 700 &&
             $(realpath -e -- "$dir") = "$dir" && $(realpath -e -- "$runtime") = "$runtime" &&
             $(realpath -e -- "$sites") = "$sites" ]] || die ACQUISITION_PATHS
          [[ -f $runtime/SHA256SUMS && ! -L $runtime/SHA256SUMS &&
             -f $runtime/SITES_COMPOSER_SHA256SUMS && ! -L $runtime/SITES_COMPOSER_SHA256SUMS ]] || die RUNTIME_MANIFEST
          (cd "$runtime" && sha256sum --check --strict --status SHA256SUMS) || die RUNTIME_SEAL
          app="$sites/apps/sites"
          [[ $(realpath -e -- "$app") = "$app" &&
             $(git -C "$sites" rev-parse HEAD) = 99aabc8300b58a1494287a841c71bb302224de44 &&
             $(git -C "$sites" hash-object "$app/composer.lock") = af69afd76d286c8f66d085c6025a54bb82f2c25c ]] || die SITES_SOURCE
          git -C "$sites" -c core.filemode=true diff --quiet HEAD -- || die SITES_SOURCE_DRIFT
          printf '%s  %s\n' c2b50d26ab282213d2ccc6619211795953d5b955f79cda8cc0c1748a97dae9e3 "$app/composer.lock" |
            sha256sum --check --strict --status || die SITES_LOCK
          (cd "$app" && sha256sum --check --strict --status "$runtime/SITES_COMPOSER_SHA256SUMS") || die SITES_VENDOR
          empty_pg
          rc=0
          env -i PATH="$PATH" LC_ALL=C ONEPAGE_TERMINAL_RUNTIME_DIR="$runtime" ONEPAGE_TERMINAL_SITES_ROOT="$sites" \
            bash tests/fixtures/sites-onepage-terminal/launcher.sh >"$work/logs/runner.log" 2>&1 || rc=$?
          [[ $(stat -c %s -- "$work/logs/runner.log") -le 4096 ]] || die RUNNER_LOG_BOUND
          grep -Ex 'ONEPAGE_TERMINAL_(ROOT_PRESCHEMA_OK|PDO_ADMITTED_OK|REVOKE_FIRST_OK|CLEANUP_OK|VALIDATION_AND_CLEANUP_OK|SIGNER_REFUSED|RUNNER_REFUSED [A-Z_]{1,40}|NAMESPACE_WITNESS_REFUSED [A-Z_]{1,40}|ENTRY_REFUSED [A-Z_]{1,40}|SCENARIO_REFUSED (FILES|FRESH|LARAVEL|MIGRATION_(01|02|03|05|06|11|12|13|14|PIN)|TERMINAL_DDL|TENANT|ROLE_(INTAKE|SOURCE|ARTIFACT|EDITOR|REVIEWER|BIND|REVOKE|PIN)|INTAKE|SNAPSHOT|RENDER|REGISTER|EDITORIAL|BIND|CUSTODY|INTENT|RACE_(SETUP|SPAWN|WAIT|CHILD(_EXIT|_TIMEOUT)?|ACK|PARENT_CLOSE|READBACK)) (CONSTRAINT|AUTH|LOCK_OR_TIMEOUT|DEFINITION|SQL_OTHER|NO_SQLSTATE)|CHILD_REFUSED (SETUP|LOCK|REQUESTED|HEAD|SHAPE|VETO|REQUESTED_TUPLE|PROPOSAL|INSERT|COMMIT|ACK|UNKNOWN)|ACK_REFUSED (IO|STDERR|EMPTY|OVERSIZE|FORMAT|CHILD_EXIT|PARENT_CLOSE)|FAILED_ACK_READBACK (NO_ROW|ONE_EXACT_REJECTED|INCONSISTENT|READ_UNAVAILABLE)|STDERR_CLASS (IO|EMPTY|OVERSIZE|WORKER_REFUSAL|PHP_DIAGNOSTIC|WHITESPACE|UNRECOGNIZED)|ACK_FRAME (EXACT|OTHER)|PHP_STARTUP_PROBE (CLEAN|NONEMPTY|OVERSIZE|STDOUT|FAILED))' \
            "$work/logs/runner.log" || :
          empty_pg
          [[ -z $(find /tmp -maxdepth 1 -name 'sites-release-registry-*' -print -quit) ]] || die LEFTOVER_SCRATCH
          ((rc==0)) || die RUNTIME_STATUS
          /usr/bin/python3 -I -B - "$work/logs/runner.log" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          if not 1 <= p.stat().st_size <= 4096: raise SystemExit('ONEPAGE_TERMINAL_MARKERS_REFUSED')
          wanted=[
              'ONEPAGE_TERMINAL_ROOT_PRESCHEMA_OK','ONEPAGE_TERMINAL_PHP_STARTUP_PROBE CLEAN',
              'ONEPAGE_TERMINAL_PDO_ADMITTED_OK',
              'ONEPAGE_TERMINAL_REVOKE_FIRST_OK','ONEPAGE_TERMINAL_CLEANUP_OK',
              'ONEPAGE_TERMINAL_VALIDATION_AND_CLEANUP_OK',
          ]
          if p.read_text(encoding='ascii').splitlines()!=wanted: raise SystemExit('ONEPAGE_TERMINAL_MARKERS_REFUSED')
          PY
          passed=true
