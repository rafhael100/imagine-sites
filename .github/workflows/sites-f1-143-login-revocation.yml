name: Sites F1-143 DB login revocation - disposable PG18
on:
  pull_request:
    paths:
      - 'labs/postgres/f1-143-login-revocation-fence.sql'
      - 'tests/f143-pg-login-scope-revocation.php'
      - '.github/workflows/sites-f1-143-login-revocation.yml'
permissions:
  contents: read
jobs:
  login-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f140-fictional-admin-ci-only
          POSTGRES_DB: sites_f140_atomic_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f140_atomic_lab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      SITES_F140_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: sites_f140_atomic_lab
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sites_f140_atomic_lab
      PGUSER: postgres
      PGPASSWORD: f140-fictional-admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Prepare ephemeral PostgreSQL tooling
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create monotonic binding + login revocation fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-140-atomic-binding-claim.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-141-monotonic-binding-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-142-db-login-tenant-fence.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-143-login-revocation-fence.sql
      - name: Test revocation against a live session
        run: |
          set -euo pipefail
          php -l tests/f143-pg-login-scope-revocation.php
          php tests/f143-pg-login-scope-revocation.php
      - name: No production changes
        if: always()
        run: echo "PG18 CI mock only; no authenticated Portal identity, customer lead, CRM ACK, VPS or deploy."
