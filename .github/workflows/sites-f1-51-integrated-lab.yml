name: Sites F1-51 integrated visual + Portal-authority laboratory
on:
  pull_request:
    paths:
      - '.github/workflows/sites-f1-51-integrated-lab.yml'
      - 'docs/SITES-F1-51-INTEGRATION-LAB.md'
      - 'apps/sites/routes/web.php'
      - 'apps/sites/routes/console.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'src/Production/SyntheticPreviewQaReport.php'
      - 'src/Security/SyntheticReviewHandoffEnvelope.php'
      - 'tests/f39-qa-report.php'
      - 'tests/f45-review-handoff-envelope.php'
      - 'tests/f46_review_contracts.py'
permissions:
  contents: read
jobs:
  combined-laravel-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,dom,xml,pdo,pdo_pgsql,curl
          coverage: none
      - name: Validate PHP and cross-language review handoff offline
        run: |
          set -euo pipefail
          php -l src/Production/SyntheticPreviewQaReport.php
          php -l src/Security/SyntheticReviewHandoffEnvelope.php
          php tests/f39-qa-report.php
          php tests/f45-review-handoff-envelope.php
          python3 tests/f46_review_contracts.py
      - name: Install locked Laravel test dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Run visual, navigation and private-gallery Laravel tests together
        working-directory: apps/sites
        env:
          APP_ENV: testing
          SITES_SYNTHETIC_HTTP: '1'
          SITES_SYNTHETIC_REVIEW_UI: '1'
        run: php artisan test --filter='(SyntheticVisualReviewHttpTest|SyntheticReviewNavigationMatrixTest|SyntheticReviewGalleryExportTest)' --no-ansi
  pinned-portal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 2f5cd9ed77340f5d4ebc8056d029a1a79c53cc11
          path: portal-f49-readonly
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Run Sites emitter with actual Portal consumer implementation
        env:
          SITES_F49_CROSS_REPO: '1'
          SITES_F49_PORTAL_PATH: portal-f49-readonly
        run: php tests/f49-review-crossrepo.php
      - name: Prohibit production effect
        if: always()
        run: echo "Offline synthetic lab only; no customer acceptance, production authentication, real HTTP, provider, VPS, domain or deploy."
