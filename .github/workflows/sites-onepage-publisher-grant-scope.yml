name: Sites Onepage publisher scoped grant reconciliation (isolated only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/sites-onepage-release-approval-reconciliation-2026-11-20-r35']
    paths:
      - 'src/Publication/OnepagePublisherGrantSnapshotCandidate.php'
      - 'src/Publication/OnepageReleaseConsentAndPublisherFenceCandidate.php'
      - 'tests/onepage-release-approval-reconciliation-offline.php'
      - 'docs/reviews/SITES-ONEPAGE-PUBLISHER-GRANT-SCOPE-2026-11-20.md'
      - '.github/workflows/sites-onepage-publisher-grant-scope.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-publisher-grant-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  onepage-publisher-grant:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/sites-onepage-publisher-grant-scope-2026-11-20-r36' &&
      github.event.pull_request.base.ref == 'test/sites-onepage-release-approval-reconciliation-2026-11-20-r35' &&
      github.event.pull_request.base.sha == '09585fa03529162b29b21d5e1d06d6e8a74f4cd0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      SITES_ONEPAGE_RELEASE_RECONCILIATION_LAB: '1'
      SITES_F391_APPROVAL_LAB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - name: Validate typed publisher grant and target/action/epoch fence
        run: |
          set -euo pipefail
          php -l src/Publication/OnepagePublisherGrantSnapshotCandidate.php
          php -l src/Publication/OnepageReleaseConsentAndPublisherFenceCandidate.php
          php -l tests/onepage-release-approval-reconciliation-offline.php
          php tests/onepage-release-approval-reconciliation-offline.php | tee "$RUNNER_TEMP/onepage-publisher-grant.log"
          grep -Eq '^ONEPAGE RELEASE CONSENT RECONCILIATION PASS: [0-9]+ synthetic assertions; NO-GO[.]$' "$RUNNER_TEMP/onepage-publisher-grant.log"
      - name: Ensure isolated scope and fail-closed default
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -e /run/secrets/imagine
          grep -Fq 'onepage_publisher_authority_unbound' src/Publication/OnepageReleaseConsentAndPublisherFenceCandidate.php
          grep -Fq 'grantEpoch' src/Publication/OnepagePublisherGrantSnapshotCandidate.php
          grep -Fq 'SignedPortalClientApprovalGate' tests/onepage-release-approval-reconciliation-offline.php
