name: Sites private Laravel persisted preview HTTP
on:
  push:
    branches: ['feature/sites-private-preview-http-2026-11-16']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITES_PREVIEW_HTTP_CI: '1'
      PREVIEW_CI_MATERIAL: /tmp/sites-preview-http-material
      PREVIEW_HTTP_EVIDENCE: /tmp/sites-preview-http-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prepare one-run synthetic materials, no operational identity
        run: sudo --preserve-env=GITHUB_ACTIONS,SITES_PREVIEW_HTTP_CI,PREVIEW_CI_MATERIAL python3 tests/fixtures/preview-http/prepare.py
      - name: Build application candidate and start disposable private PostgreSQL
        run: |
          set -euo pipefail
          docker compose -f tests/fixtures/preview-http/compose.yaml build app
          docker compose -f tests/fixtures/preview-http/compose.yaml up -d --wait db
          cluster=$(docker compose -f tests/fixtures/preview-http/compose.yaml exec -T db psql -U postgres -d sites_preview_http_ci -Atc 'SELECT system_identifier FROM pg_control_system()')
          echo "PREVIEW_EXPECTED_CLUSTER=$cluster" >> "$GITHUB_ENV"
      - name: Verify SQL identity before additive schema on disposable database only
        run: |
          set -euo pipefail
          args=(-f tests/fixtures/preview-http/compose.yaml run --rm --no-deps --user 0 -v "$PREVIEW_CI_MATERIAL:/run/ci:ro" -v "$GITHUB_WORKSPACE/tests/fixtures/preview-http/bootstrap.php:/tmp/bootstrap.php:ro" -e GITHUB_ACTIONS=true -e SITES_PREVIEW_HTTP_CI=1)
          if docker compose "${args[@]}" -e PREVIEW_EXPECTED_CLUSTER=0 app php /tmp/bootstrap.php > "$RUNNER_TEMP/denied.log" 2>&1; then
            echo 'Wrong cluster bootstrap accepted' >&2; exit 1
          fi
          grep -q PREVIEW_HTTP_BOOTSTRAP_DENIED "$RUNNER_TEMP/denied.log"
          test "$(docker compose -f tests/fixtures/preview-http/compose.yaml exec -T db psql -U postgres -d sites_preview_http_ci -Atc "SELECT count(*) FROM pg_namespace WHERE nspname='sites_preview'")" = 0
          docker compose "${args[@]}" -e PREVIEW_EXPECTED_CLUSTER="$PREVIEW_EXPECTED_CLUSTER" app php /tmp/bootstrap.php
      - name: Real FPM Nginx HTTPS nominal access with TLS verified
        run: |
          set -euo pipefail
          docker compose -f tests/fixtures/preview-http/compose.yaml up -d app proxy
          for attempt in $(seq 1 30); do
            code=$(curl --cacert "$PREVIEW_CI_MATERIAL/ca.pem" -s -o /dev/null -w '%{http_code}' https://127.0.0.1:18496/_preview || true)
            if test "$code" = 401; then break; fi
            sleep 1
          done
          test "$code" = 401
          if curl --cacert "$PREVIEW_CI_MATERIAL/db.pem" -s -o /dev/null https://127.0.0.1:18496/_preview; then
            echo 'Wrong trust anchor accepted' >&2; exit 1
          fi
      - name: Real authenticated browser journey and failure recovery
        run: |
          set -euo pipefail
          sudo chmod 644 "$PREVIEW_CI_MATERIAL/browser.json"
          mkdir -p "$RUNNER_TEMP/preview-browser"
          cd "$RUNNER_TEMP/preview-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          NODE_PATH="$RUNNER_TEMP/preview-browser/node_modules" node "$GITHUB_WORKSPACE/tests/fixtures/preview-http/browser.cjs"
      - name: Sanitized failure status
        if: failure()
        run: |
          docker compose -f tests/fixtures/preview-http/compose.yaml ps
          docker compose -f tests/fixtures/preview-http/compose.yaml logs --tail 20 app proxy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sites-private-laravel-demo-http
          path: /tmp/sites-preview-http-evidence
          retention-days: 7
      - name: Remove CI-only disposable resources
        if: always()
        run: |
          docker compose -f tests/fixtures/preview-http/compose.yaml down -v --remove-orphans
          sudo rm -rf "$PREVIEW_CI_MATERIAL"
