name: Sites F1-147 PHP lease adapter no delivery (PG18 CI)
on:
  pull_request:
    paths:
      - 'src/Integration/LabSyntheticOutboxLeaseAssessment.php'
      - 'src/Integration/LabPostgresSyntheticOutboxLease.php'
      - 'tests/f147-php-lease-adapter.php'
      - '.github/workflows/sites-f1-147-php-lease-bridge.yml'
permissions:
  contents: read
jobs:
  lease-adapter-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f140-fictional-admin-ci-only
          POSTGRES_DB: sites_f140_atomic_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f140_atomic_lab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      SITES_F140_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: sites_f140_atomic_lab
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sites_f140_atomic_lab
      PGUSER: postgres
      PGPASSWORD: f140-fictional-admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          tools: none
          coverage: none
      - name: Prepare ephemeral PostgreSQL
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Install lab fixtures only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-140-atomic-binding-claim.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-141-monotonic-binding-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-142-db-login-tenant-fence.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-143-login-revocation-fence.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-145-atomic-technical-outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-146-metadata-outbox-lease.sql
      - name: Lint and test deny-only PHP lease adapter
        run: |
          set -euo pipefail
          php -l src/Integration/LabSyntheticOutboxLeaseAssessment.php
          php -l src/Integration/LabPostgresSyntheticOutboxLease.php
          php -l tests/f147-php-lease-adapter.php
          php tests/f147-php-lease-adapter.php
      - name: No production delivery
        if: always()
        run: echo "CI only; no Portal IAM, CRM call/ACK, real lead, VPS, deploy or automatic retry."
