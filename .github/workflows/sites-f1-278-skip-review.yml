name: Sites F1-278 editor keyboard skip-link review reset
on:
  pull_request:
    paths:
      - 'src/Production/SyntheticSkipNavigationRevisionPlan.php'
      - 'tests/f278-skip-navigation-revision.php'
      - '.github/workflows/sites-f1-278-skip-review.yml'
permissions:
  contents: read
jobs:
  private-keyboard-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml
          tools: none
          coverage: none
      - name: Validate release reset for opt-in skip navigation
        run: |
          set -euo pipefail
          php -l src/Production/SyntheticSkipNavigationRevisionPlan.php
          php -l tests/f278-skip-navigation-revision.php
          php tests/f277-keyboard-skip-link.php
          php tests/f278-skip-navigation-revision.php
      - name: Scope
        if: always()
        run: echo 'Synthetic revision only; no user portal acceptance, customer URLs, CRM or deploy.'
