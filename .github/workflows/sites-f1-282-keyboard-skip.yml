name: Sites F1-282 keyboard skip-to-content across synthetic previews
on:
  pull_request:
    paths:
      - 'src/Production/SiteBrief.php'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/InertPreviewAudit.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'tests/f282-keyboard-skip-to-main.php'
      - '.github/workflows/sites-f1-282-keyboard-skip.yml'
permissions:
  contents: read
jobs:
  static-keyboard-bypass:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml
          tools: none
          coverage: none
      - name: Verify all old HTML, focus semantics and private release hashes
        run: |
          set -euo pipefail
          php -l src/Production/StaticSiteRenderer.php
          php -l src/Production/SiteBrief.php
          php -l tests/f282-keyboard-skip-to-main.php
          php tests/f27-offline-preview-audit.php
          php tests/f39-qa-report.php
          php tests/f270-faq-native-disclosure.php
          php tests/f282-keyboard-skip-to-main.php
      - name: Scope
        if: always()
        run: echo 'Reviewer-only opt-in; no scripts, real customers, public URLs, form, CRM API or deploy.'
