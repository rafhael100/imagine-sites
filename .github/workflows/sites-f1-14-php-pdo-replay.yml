name: Sites F1-14 PHP PDO replay integration - disposable PostgreSQL

on:
  pull_request:
    paths:
      - 'src/Security/LabPostgresReplayStore.php'
      - 'tests/f14-pg.php'
      - 'labs/security/f1-12-nonce-schema.sql'
      - '.github/workflows/sites-f1-14-php-pdo-replay.yml'
      - 'docs/SITES-F1-14-PDO-REPLAY-ADAPTER.md'

permissions:
  contents: read

jobs:
  php-pgsql-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      SITES_F1_14_PG_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: nonce-lab-fictional-only
      PGDATABASE: sites_auth_replay_lab
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nonce-lab-fictional-only
          POSTGRES_DB: sites_auth_replay_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_auth_replay_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo, pdo_pgsql
          coverage: none
      - name: Ensure PostgreSQL CLI exists
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable replay fence schema
        run: psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-12-nonce-schema.sql
      - name: PHP syntax
        run: |
          php -l src/Security/LabPostgresReplayStore.php
          php -l tests/f14-pg.php
      - name: Execute real PDO atomic/replay tests with fictional data
        run: php tests/f14-pg.php
      - name: Lab-only acknowledgement
        if: always()
        run: echo "Ephemeral PostgreSQL, no production secrets, no client HTTP, no deploy."
