name: Sites F1-164 compare optional FAQ and services in Laravel review
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticRichReviewComparisonTest.php'
      - '.github/workflows/sites-f1-164-rich-compare.yml'
permissions:
  contents: read
jobs:
  rich-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,xml,dom,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Lint route and comparison tests
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticRichReviewComparisonTest.php
      - name: Install locked Laravel test-only dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Deny comparison route outside explicit lab opts
        working-directory: apps/sites
        env:
          APP_ENV: testing
          SITES_SYNTHETIC_HTTP: '0'
          SITES_SYNTHETIC_REVIEW_UI: '0'
          SITES_SYNTHETIC_RICH_REVIEW: '0'
          SITES_SYNTHETIC_RICH_COMPARE: '0'
        run: |
          set -euo pipefail
          if php artisan route:list --path=_lab/sites/v1/rich-compare --json | grep -q 'sites.lab.rich-compare'; then
            echo "Comparison route registered by default!" >&2
            exit 1
          fi
      - name: Test real in-process Laravel variant comparison and legacy UI
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticRichReviewComparisonTest|SyntheticRichReviewUiTest|SyntheticRichReviewGalleryExportTest)' --no-ansi
      - name: Scope
        if: always()
        run: echo "Private synthetic review only; no client data, API, automatic acceptance, site publication or deploy."
