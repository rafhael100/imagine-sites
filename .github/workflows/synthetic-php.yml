name: Sites Engine - testes sinteticos (sem deploy)
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pure-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: mbstring,dom,xml
          coverage: none
      - name: PHP syntax
        run: |
          for f in src/Domain/*.php src/Application/*.php src/Integration/*.php src/Production/*.php src/Publication/*.php src/Security/*.php src/Compatibility/*.php tests/*.php; do php -l "$f" || exit 1; done
      - name: Unit, parity and synthetic system tests
        run: |
          php tests/run.php
          php tests/f2-run.php
          php tests/f4-run.php
          php tests/f6-run.php
          php tests/f9-run.php
          php tests/f11-run.php
          php tests/f16-run.php
          php tests/f17-run.php
          php tests/f20-run.php
          php tests/f26-rotation.php
          php tests/f27-offline-preview-audit.php
          php tests/f28-production-flow.php
          php tests/f29-structured-copy.php
          php tests/f30-ai-credit-quota.php
          php tests/f31-portal-handoff.php
          php tests/f39-qa-report.php
          php tests/f45-review-handoff-envelope.php
          php tests/f48-current-portal-authority.php
          php tests/f50-review-epoch.php
          php tests/f51-style-presets.php
          php tests/f54-style-revision.php
          php tests/f55-crm-lead-preflight.php
          php tests/f130-crm-binding-epoch-preflight.php
          php tests/f63-editorial.php
          php tests/f68-content-revision.php
          php tests/f71-structured-draft.php
          php tests/f75-canonical-bundle.php
          php tests/f76-internal-review-evidence.php
          php tests/f77-review-dossier.php
          php tests/f89-loopback-served-artifact.php
          php tests/f102-portal-project-snapshot.php
          php tests/f109-portal-auth-schema-parity.php
          php tests/f169-process-steps-copy-v4.php
          php tests/f171-editorial-patch.php
          php tests/f175-static-section-order.php
          php tests/f178-safe-section-anchor-navigation.php
          php tests/f185-canonical-private-package.php
          php tests/f187-combined-layout-revision.php
          php tests/f204-visual-preset-catalog.php
          php tests/f205-composite-visual-private-package.php
          php tests/f206-social-preview-metadata.php
          php tests/f207-social-preview-revision.php
          php tests/f209-composite-social-private-package.php
          php tests/f210-social-card-inspection.php
          php tests/f211-private-social-card-readback.php
          php tests/f213-visual-review-export-parity.php
          php tests/f215-seo-snippet-inspection.php
