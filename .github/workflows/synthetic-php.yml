name: Sites Engine - testes sinteticos (sem deploy)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Verificar sintaxe PHP
        run: |
          for f in src/Domain/*.php src/Application/*.php tests/*.php; do php -l "$f" || exit 1; done
      - name: Executar verificacoes puras sem terceiros
        run: |
          php tests/run.php
          php tests/f2-run.php
