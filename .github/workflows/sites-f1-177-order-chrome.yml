name: Sites F1-177 six section permutations on real Chromium
on:
  pull_request:
    paths:
      - 'tests/f177-order-chrome-fixtures.php'
      - 'ci/f177_order_cdp.py'
      - '.github/workflows/sites-f1-177-order-chrome.yml'
permissions:
  contents: read
jobs:
  six-order-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      APP_ENV: testing
      SITES_F177_CHROME_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Validate safe fixture and CDP program
        run: |
          set -euo pipefail
          php -l tests/f177-order-chrome-fixtures.php
          python3 -m py_compile ci/f177_order_cdp.py ci/f43_cdp.py ci/f44_contrast.py
      - name: Build exactly 36 private HTML files with SHA-256
        run: |
          set -euo pipefail
          php tests/f177-order-chrome-fixtures.php
          test -f /tmp/sites-f177-order-gallery/gallery-manifest.json
      - name: Verify 108 actual Chromium layouts and DOM orders
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if test -z "$browser"; then
            echo "Preinstalled Chromium unavailable; no external provider/install." >&2
            exit 1
          fi
          "$browser" --version
          python3 ci/f177_order_cdp.py /tmp/sites-f177-order-gallery "$browser"
      - name: Remove all fictional preview material
        if: always()
        run: |
          rm -rf /tmp/sites-f177-order-gallery ci/__pycache__
          echo "No screenshots, client data, forms, CRM, public routes or deployment."
