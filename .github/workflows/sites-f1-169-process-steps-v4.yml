name: Sites F1-169 ordered process section and structured copy v4
on:
  pull_request:
    paths:
      - 'src/Production/SiteBrief.php'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/StructuredCopyCandidate.php'
      - 'src/Production/InertPreviewAudit.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'src/Production/SyntheticStyleRevisionPlan.php'
      - 'src/Production/SyntheticContentRevisionPlan.php'
      - 'tests/f169-process-steps-copy-v4.php'
      - '.github/workflows/sites-f1-169-process-steps-v4.yml'
permissions:
  contents: read
jobs:
  process-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Lint changed PHP and verify backward compatibility
        run: |
          set -euo pipefail
          php -l src/Production/SiteBrief.php
          php -l src/Production/StaticSiteRenderer.php
          php -l src/Production/StructuredCopyCandidate.php
          php -l src/Production/InertPreviewAudit.php
          php -l src/Production/SyntheticStructuredDraftAssembly.php
          php -l tests/f169-process-steps-copy-v4.php
          php tests/f29-structured-copy.php
          php tests/f71-structured-draft.php
          php tests/f157-static-faq-content.php
          php tests/f158-structured-copy-v2-faq-draft.php
          php tests/f159-services-highlights-ai-copy-v3.php
      - name: Prove v4 process cards, review invalidation and no publication
        run: |
          set -euo pipefail
          php tests/f169-process-steps-copy-v4.php
          echo "Static synthetic informational steps only. No real AI, forms, CRM, DNS or deploy."
