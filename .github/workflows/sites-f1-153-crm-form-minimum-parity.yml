name: Sites F1-153 actual CRM Imagine Site form-minimum parity
on:
  pull_request:
    paths:
      - 'src/Integration/SyntheticSiteContactMinimum*.php'
      - 'tests/f153-crm-sites-contact-minimum-parity.php'
      - '.github/workflows/sites-f1-153-crm-form-minimum-parity.yml'
permissions:
  contents: read
jobs:
  form-minimum-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact independent CRM source
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-crm
          ref: 0ee32ec1268047a52b5429622fb5f34716f818ae
          path: crm-current
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint two repositories and pin CRM SHA
        run: |
          set -euo pipefail
          test "$(git -C crm-current rev-parse HEAD)" = 0ee32ec1268047a52b5429622fb5f34716f818ae
          test -f crm-current/app/Core/Leads/LeadDraftFields.php
          test -f crm-current/app/Core/Leads/ImagineSiteFormMinimumInspector.php
          php -l src/Integration/SyntheticSiteContactMinimumInspector.php
          php -l src/Integration/SyntheticSiteContactMinimumAssessment.php
          php -l tests/f153-crm-sites-contact-minimum-parity.php
      - name: Run independent contact minimum validators against fake examples
        run: |
          set -euo pipefail
          php tests/f153-crm-sites-contact-minimum-parity.php
          echo "Form shape is not consent, PII processing authority or actual CRM intake."
