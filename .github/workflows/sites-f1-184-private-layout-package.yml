name: Sites F1-184 private combined-layout review package
on:
  pull_request:
    paths:
      - 'src/Production/SyntheticPrivateReviewPackageV1.php'
      - 'src/Production/SyntheticPrivateDraftWriter.php'
      - 'apps/sites/routes/console.php'
      - 'apps/sites/tests/Feature/SyntheticCombinedLayoutPrivateBundleTest.php'
      - '.github/workflows/sites-f1-184-private-layout-package.yml'
permissions:
  contents: read
jobs:
  private-combined-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      APP_ENV: testing
      SITES_F184_LAYOUT_PACKAGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Lint new private packaging capability
        run: |
          set -euo pipefail
          php -l src/Production/SyntheticPrivateReviewPackageV1.php
          php -l src/Production/SyntheticPrivateDraftWriter.php
          php -l apps/sites/routes/console.php
          php -l apps/sites/tests/Feature/SyntheticCombinedLayoutPrivateBundleTest.php
      - name: Install locked Laravel test dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Test 54 immutable layout packages and old edited bundles
        working-directory: apps/sites
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticCombinedLayoutPrivateBundleTest|SyntheticEditedPrivateBundleTest|SyntheticCombinedLayoutReviewTest)' --no-ansi
      - name: Remove all temporary files in runner
        if: always()
        working-directory: apps/sites
        run: |
          rm -rf storage/app/private/sites-f1-184-*
          echo "No real customer, IAM, CRM, hosting or publication."
