name: Sites F1-41 private offline visual-review gallery - no deploy
on:
  pull_request:
    paths:
      - 'apps/sites/routes/console.php'
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticReviewGalleryExportTest.php'
      - '.github/workflows/sites-f1-41-offline-review-gallery.yml'
      - 'docs/SITES-F1-41-OFFLINE-GALLERY.md'
      - 'ci/f42_browser_smoke.py'
      - 'ci/f43_cdp.py'
      - 'docs/SITES-F1-43-BROWSER-A11Y-GATE.md'
      - 'docs/SITES-F1-42-HEADLESS-VISUAL-QA.md'
permissions:
  contents: read
jobs:
  private-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,xml,dom,curl,pdo,pdo_pgsql
          coverage: none
      - name: Syntax
        run: |
          php -l apps/sites/routes/console.php
          php -l apps/sites/tests/Feature/SyntheticReviewGalleryExportTest.php
      - name: Install isolated, locked Laravel test dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Deny artifact generation by default
        working-directory: apps/sites
        env:
          APP_ENV: testing
          SITES_SYNTHETIC_HTTP: '0'
          SITES_SYNTHETIC_REVIEW_UI: '0'
          SITES_SYNTHETIC_EXPORT: '0'
        run: |
          set -euo pipefail
          if php artisan sites:export-review-gallery-fixture; then
            echo "F1-41 exporter unexpectedly enabled by default"
            exit 1
          fi
      - name: Produce private fictional HTML previews without HTTP/network
        working-directory: apps/sites
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          SESSION_DRIVER: array
          CACHE_STORE: array
          SITES_SYNTHETIC_HTTP: '1'
          SITES_SYNTHETIC_REVIEW_UI: '1'
          SITES_SYNTHETIC_EXPORT: '1'
        run: |
          set -euo pipefail
          php artisan sites:export-review-gallery-fixture
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('storage/app/private/sites-f1-41-gallery')
          m=json.loads((root/'gallery-manifest.json').read_text())
          assert m['publishable'] is False and m['officialClientAcceptance'] is False
          assert len(m['pages'])==4
          for entry in m['pages']:
              b=(root/entry['filename']).read_bytes()
              assert hashlib.sha256(b).hexdigest()==entry['sha256']
              assert len(b)==entry['bytes']
          print('PASS: four byte-exact fictional HTML previews with immutable manifest')
          PY
      - name: F1-42 open the four HTML files in the runner's preinstalled Chromium
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if test -z "$browser"; then
            echo "No Chrome/Chromium preinstalled: no automatic software download."
            exit 1
          fi
          "$browser" --version
          root="$PWD/apps/sites/storage/app/private/sites-f1-41-gallery"
          screenshots="$RUNNER_TEMP/sites-f42-screenshots"
          mkdir -p "$screenshots"
          for product in onepage landing_page; do
            for device in desktop mobile; do
              if [ "$device" = desktop ]; then dimensions='1365,900'; else dimensions='390,844'; fi
              filename="$product-$device"
              "$browser" --headless=new --no-sandbox --disable-gpu \
                --disable-background-networking --disable-sync --disable-extensions \
                --no-first-run --no-default-browser-check --hide-scrollbars \
                --force-device-scale-factor=1 --window-size="$dimensions" \
                --screenshot="$screenshots/$filename.png" \
                "file://$root/$filename.html" >"$RUNNER_TEMP/sites-f42-chrome.log" 2>&1
              test -s "$screenshots/$filename.png"
            done
          done
          python3 ci/f42_browser_smoke.py "$root" "$screenshots"
          python3 ci/f43_cdp.py "$root" "$browser"
          rm -rf "$screenshots"
      - name: Remove the private gallery before isolated PHPUnit tests
        working-directory: apps/sites
        if: always()
        run: rm -rf storage/app/private/sites-f1-41-gallery
      - name: Verify default-deny and export file safety with Laravel tests
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: php artisan test --filter=SyntheticReviewGalleryExportTest --no-ansi
      - name: Scope declaration
        if: always()
        run: echo "No hosting, no artifact upload, no Portal/customer data, no deploy, no paid AI, no Cloudflare/VPS."
