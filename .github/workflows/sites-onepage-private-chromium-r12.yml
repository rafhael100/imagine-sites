name: Sites OnePage Chromium corrupted-ledger refusal R12 (CI only)
'on':
  push:
    branches: ['test/onepage-chromium-corrupt-ledger-r12-2026-11-22']
    paths:
      - 'tests/onepage-private-chromium-r05.php'
      - 'tests/onepage-private-chromium-cdp-r05.mjs'
      - '.github/workflows/sites-onepage-private-chromium-r12.yml'
      - 'docs/reviews/SITES-ONEPAGE-PRIVATE-CHROMIUM-R12-2026-11-22.md'
  pull_request:
    types: [opened, synchronize]
    branches: ['test/onepage-chromium-concurrent-exact-receipts-r11-2026-11-22']
    paths:
      - 'tests/onepage-private-chromium-r05.php'
      - 'tests/onepage-private-chromium-cdp-r05.mjs'
      - '.github/workflows/sites-onepage-private-chromium-r12.yml'
      - 'docs/reviews/SITES-ONEPAGE-PRIVATE-CHROMIUM-R12-2026-11-22.md'
permissions:
  contents: read
concurrency:
  group: sites-onepage-chromium-r12-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  chromium-private-session-witness:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/test/onepage-chromium-corrupt-ledger-r12-2026-11-22') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.draft == true &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.base.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'test/onepage-chromium-corrupt-ledger-r12-2026-11-22' &&
         github.event.pull_request.base.ref == 'test/onepage-chromium-concurrent-exact-receipts-r11-2026-11-22' &&
         github.event.pull_request.base.sha == '88ffd133b43ba095da3b3384604c9e37d765a3b5')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Install isolated Chromium as existing R05
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sites-r12-venv"
          source "$RUNNER_TEMP/sites-r12-venv/bin/activate"
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify exact child scope and exercise denied guest and buyer Chromium
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 - <<'PY'
          import subprocess
          expected = {
            'tests/onepage-private-chromium-r05.php',
            'tests/onepage-private-chromium-cdp-r05.mjs',
            '.github/workflows/sites-onepage-private-chromium-r12.yml',
            'docs/reviews/SITES-ONEPAGE-PRIVATE-CHROMIUM-R12-2026-11-22.md',
          }
          changed = set(subprocess.check_output([
            'git','diff','--name-only','88ffd133b43ba095da3b3384604c9e37d765a3b5','HEAD'
          ], text=True).splitlines())
          assert changed == expected, 'R12_SCOPE_REFUSED'
          PY
          php -l tests/onepage-private-chromium-r05.php
          node --check tests/onepage-private-chromium-cdp-r05.mjs
          node -e 'if (typeof WebSocket!=="function") process.exit(1)'
          source "$RUNNER_TEMP/sites-r12-venv/bin/activate"
          export BROWSER_BIN="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$BROWSER_BIN"
          test ! -e .env.production
          test ! -e /run/secrets/imagine
          php tests/onepage-private-chromium-r05.php | tee "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Eq '^ONEPAGE R05 CHROMIUM PASS: [0-9]+ checks; NO-GO[.]$' "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Fq 'ONEPAGE R07 READBACK PASS: 3 release epochs, B/C same HTML SHA, obsolete click denied, no fourth effect; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Fq 'ONEPAGE R08 READBACK PASS: presentation session mismatch denied, fresh session replay idempotent, 3 receipts; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Fq 'ONEPAGE R09 READBACK PASS: independent same-buyer session witnesses survive interleaving, no fourth effect; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Fq 'ONEPAGE R10 READBACK PASS: undurable receipt sink denied HTTP 503 and three original receipts preserved; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"
          grep -Fq 'ONEPAGE R11 READBACK PASS: 12 parallel same-ref POSTs, one new exact receipt, eleven idempotent reads, no duplicate; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"

          grep -Fq 'ONEPAGE R12 READBACK PASS: malformed historical receipt denied HTTP 503 before fresh append; NO-GO.' "$RUNNER_TEMP/sites-onepage-r12.log"
