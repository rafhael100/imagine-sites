name: F1-03 Laravel isolado - sintético sem deploy
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolated-laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, xml, dom, curl, pdo, pdo_pgsql
          coverage: none
      - name: Validate composer metadata and lock
        working-directory: apps/sites
        run: composer validate --strict
      - name: Install locked dependencies (no scripts)
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: PHP syntax (application and tests)
        run: |
          for f in apps/sites/artisan apps/sites/bootstrap/*.php apps/sites/routes/*.php apps/sites/public/index.php apps/sites/tests/*.php apps/sites/tests/Feature/*.php apps/sites/app/Providers/*.php apps/sites/app/Http/Middleware/*.php; do php -l "$f" || exit 1; done
      - name: Verify production routes stay absent by default
        working-directory: apps/sites
        run: |
          set -euo pipefail
          php artisan route:list --json > "$RUNNER_TEMP/sites-routes.json"
          ! grep -q '_lab/sites/v1/create-project' "$RUNNER_TEMP/sites-routes.json"
          ! grep -q '_lab/sites/v3/create-project' "$RUNNER_TEMP/sites-routes.json"
          rm -f "$RUNNER_TEMP/sites-routes.json"
      - name: Standard Laravel tests with synthetic HTTP disabled
        working-directory: apps/sites
        run: php artisan test --no-ansi
      - name: Opt-in in-process CLI HTTP contract lab
        working-directory: apps/sites
        env:
          SITES_SYNTHETIC_HTTP: '1'
        run: php artisan test --no-ansi
      - name: Prove synthetic routes are denied by real non-CLI localhost HTTP SAPI
        env:
          APP_ENV: testing
          SITES_F234_LOCAL_HTTP_LAB: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile ci/f234_noncli_lab_http_smoke.py
          python3 ci/f234_noncli_lab_http_smoke.py
      - name: Render fictional local preview only in testing mode
        working-directory: apps/sites
        env:
          APP_ENV: testing
          SITES_SYNTHETIC_PREVIEW: '1'
        run: |
          php artisan sites:preview-fixture onepage
          php artisan sites:preview-fixture landing_page
          test -s storage/app/private/sites-f1-07-onepage.html
          test -s storage/app/private/sites-f1-07-landing_page.html
          grep -q 'noindex, nofollow' storage/app/private/sites-f1-07-onepage.html
          grep -q 'data-site-product="landing-page"' storage/app/private/sites-f1-07-landing_page.html
          rm -f storage/app/private/sites-f1-07-onepage.html storage/app/private/sites-f1-07-landing_page.html
