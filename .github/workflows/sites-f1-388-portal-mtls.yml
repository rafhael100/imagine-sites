name: Sites F1-388 Portal mTLS proof transport CI
on:
  push:
    branches:
      - feature/sites-f1-388-portal-mtls-proof-transport-2026-11-14
  pull_request:
    paths:
      - 'src/Integration/PortalProofMtlsHttpSource.php'
      - 'tests/f388-*'
      - 'tests/fixtures/f388-*'
      - '.github/workflows/sites-f1-388-portal-mtls.yml'
permissions:
  contents: read
jobs:
  portal-mtls-to-sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      SITES_F388_MTLS_LAB: '1'
      F388_FIXTURE_DIR: /tmp/f388-fixture
      F388_PORTAL_CHECKOUT: ./portal-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 45778e950316874bdf227da7839caabebbd12e11
          path: portal-candidate
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: sodium,curl
          coverage: none
      - name: Validate files and pinned Portal issuer
        run: |
          set -euo pipefail
          test "$(git -C portal-candidate rev-parse HEAD)" = 45778e950316874bdf227da7839caabebbd12e11
          php -l src/Integration/PortalProofMtlsHttpSource.php
          php -l tests/f388-generate-pinned-portal-proof.php
          php -l tests/f388-mtls-proof-to-sites.php
          python3 -m py_compile tests/fixtures/f388-fake-portal-mtls-server.py
      - name: Create ephemeral CA and client certificates
        run: bash tests/f388-prepare-mtls-certs.sh
      - name: Produce fictional Ed25519 proof with original Portal code
        run: php tests/f388-generate-pinned-portal-proof.php
      - name: Start private HTTPS server requiring client mTLS
        run: bash tests/f388-start-local-mtls.sh
      - name: Check HTTPS proof and independent settlement and revocation
        run: |
          set -euo pipefail
          if SITES_F388_MTLS_LAB=0 php tests/f388-mtls-proof-to-sites.php; then
            echo 'CI guard failed'
            exit 1
          fi
          php tests/f388-mtls-proof-to-sites.php
      - name: Assert no public route or live proof source binding
        run: |
          set -euo pipefail
          ! grep -R -n 'PortalProofMtlsHttpSource' apps/sites/app/Providers apps/sites/routes
          echo 'NO-GO remains until Portal IAM, PSP and revocation are official.'
      - name: Destroy local HTTPS server and certificate files
        if: always()
        run: |
          if [ -f /tmp/f388-portal-server.pid ]; then
            kill "$(cat /tmp/f388-portal-server.pid)" 2>/dev/null || true
          fi
          rm -rf -- /tmp/f388-fixture
          rm -f -- /tmp/f388-portal-server.pid /tmp/f388-portal-server.log
