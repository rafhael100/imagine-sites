name: Sites F1-49 RLS current review source and replay - disposable PG18
on:
  pull_request:
    paths:
      - 'labs/security/f1-49-current-review-source.sql'
      - 'src/Application/LabPostgresCurrentPortalReviewSource.php'
      - 'tests/f49-pg-current-review.php'
      - '.github/workflows/sites-f1-49-portal-current-source.yml'
      - 'docs/SITES-F1-49-PG-CURRENT-REVIEW.md'
      - 'src/Application/SnapshotBoundReviewAuthorityGateway.php'
permissions:
  contents: read
jobs:
  current-authority-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nonce-lab-fictional-only
          POSTGRES_DB: sites_auth_replay_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_auth_replay_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SITES_F47_PG_LAB: '1'
      SITES_F49_PG_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: nonce-lab-fictional-only
      PGDATABASE: sites_auth_replay_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo,pdo_pgsql
          coverage: none
      - name: Ensure psql is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create synthetic replay and Portal current-state schemas
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-12-nonce-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-47-review-nonce-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-49-current-review-source.sql
      - name: Check PHP syntax of the isolated adapter and tests
        run: |
          php -l src/Application/LabPostgresCurrentPortalReviewSource.php
          php -l tests/f49-pg-current-review.php
      - name: Run SQL-RLS source, signed workflow and durable nonce tests
        run: php tests/f49-pg-current-review.php
      - name: CI-only, never production Portal
        if: always()
        run: echo "Disposable PG with fictional values. No service identity, live Portal, cloud, credentials, client or deploy."
