name: Sites F1-150 CRM F3-48 current-source ingress parity
on:
  pull_request:
    paths:
      - 'src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php'
      - 'tests/f150-crm-current-technical-ingress-parity.php'
      - '.github/workflows/sites-f1-150-current-crm-ingress-parity.yml'
permissions:
  contents: read
jobs:
  crm-ingress-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact CRM F3-49 integration laboratory
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-crm
          ref: 0ee32ec1268047a52b5429622fb5f34716f818ae
          path: crm-current
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Pin source and reject missing CRM components
        run: |
          set -euo pipefail
          test "$(git -C crm-current rev-parse HEAD)" = 0ee32ec1268047a52b5429622fb5f34716f818ae
          test -f crm-current/app/Core/Leads/PortalTechnicalEnvelopeDecoder.php
          test -f crm-current/app/Core/Leads/PortalIngressPreparationBoundary.php
          test -f crm-current/app/Core/Leads/PortalServiceHandoffInspector.php
          test -f crm-current/app/Core/Leads/SyntheticLeadEnvelopeV1Inspector.php
          php -l src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php
          php -l tests/f150-crm-current-technical-ingress-parity.php
      - name: Exercise actual CRM strict JSON plus MAC composition
        run: |
          set -euo pipefail
          php tests/f150-crm-current-technical-ingress-parity.php
          echo "Pure contract parity only; no IAM, real lead, CRM call or delivery."
