name: Sites F1-158 structured AI copy v2 FAQ -> private review (no AI)
on:
  pull_request:
    paths:
      - 'src/Production/StructuredCopyCandidate.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'tests/f158-structured-copy-v2-faq-draft.php'
      - '.github/workflows/sites-f1-158-ai-copy-v2-faq.yml'
permissions:
  contents: read
jobs:
  static-copy-faq:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: PHP lint and backwards-compatible copy tests
        run: |
          set -euo pipefail
          php -l src/Production/StructuredCopyCandidate.php
          php -l src/Production/SyntheticStructuredDraftAssembly.php
          php -l tests/f158-structured-copy-v2-faq-draft.php
          php tests/f29-structured-copy.php
          php tests/f71-structured-draft.php
          php tests/f157-static-faq-content.php
      - name: Test v2 FAQ from synthetic copy through private review
        run: |
          set -euo pipefail
          php tests/f158-structured-copy-v2-faq-draft.php
          echo "No external AI, no customer data, no auto-approval or production."
