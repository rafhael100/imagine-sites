name: Sites Onepage served HTML bytes witness R03 (CI only)
'on':
  pull_request:
    types: [opened, synchronize]
    branches: ['test/onepage-independent-presentation-witness-r02-2026-11-22']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-final-acceptance-artifact-drift-offline.php'
      - '.github/workflows/sites-onepage-served-html-bytes-r03.yml'
      - 'docs/reviews/SITES-ONEPAGE-SERVED-HTML-BYTES-R03-2026-11-22.md'
permissions:
  contents: read
concurrency:
  group: sites-onepage-served-bytes-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  served-html-bytes:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/onepage-served-html-bytes-r03-2026-11-22' &&
      github.event.pull_request.base.ref == 'test/onepage-independent-presentation-witness-r02-2026-11-22' &&
      github.event.pull_request.base.sha == 'af6e9e781808cb57409953524e2840622de6751b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          tools: none
          coverage: none
      - name: Verify scoped delta and exact synthetic HTML byte validation
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python3 - <<'PY'
          import subprocess
          permitted = {
            'src/Production/OnepageExactFinalAcceptanceReadCandidate.php',
            'tests/onepage-final-acceptance-artifact-drift-offline.php',
            '.github/workflows/sites-onepage-served-html-bytes-r03.yml',
            'docs/reviews/SITES-ONEPAGE-SERVED-HTML-BYTES-R03-2026-11-22.md',
          }
          changed = set(subprocess.check_output(
            ['git','diff','--name-only','af6e9e781808cb57409953524e2840622de6751b','HEAD'],
            text=True).splitlines())
          assert changed == permitted, 'SCOPE_REFUSED'
          PY
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-final-acceptance-artifact-drift-offline.php
          grep -Fq "hash('sha256', \$record['servedHtmlBytes'])" src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php tests/onepage-final-acceptance-artifact-drift-offline.php | tee "$RUNNER_TEMP/onepage-served-html-r03.log"
          grep -Eq '^ONEPAGE FINAL ACCEPTANCE ARTIFACT DRIFT PASS: [0-9]+ synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/onepage-served-html-r03.log"
          test ! -e .env.production
          test ! -e /run/secrets/imagine
