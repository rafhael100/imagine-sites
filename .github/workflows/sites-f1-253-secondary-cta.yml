name: Sites F1-253 opt-in secondary local CTA
on:
  pull_request:
    paths:
      - 'src/Production/SiteBrief.php'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/InertPreviewAudit.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'src/Production/SyntheticContentRevisionPlan.php'
      - 'src/Production/SyntheticStyleRevisionPlan.php'
      - 'src/Production/SyntheticSectionOrderRevisionPlan.php'
      - 'src/Production/SyntheticEditorialPatchV1.php'
      - 'src/Production/SyntheticCombinedLayoutRevisionPlan.php'
      - 'src/Production/SyntheticCompositeVisualRevisionPlan.php'
      - 'src/Production/SyntheticSeoCopyRevisionPlan.php'
      - 'src/Production/SyntheticSocialPreviewRevisionPlan.php'
      - 'tests/f253-secondary-local-cta.php'
      - '.github/workflows/sites-f1-253-secondary-cta.yml'
permissions:
  contents: read
jobs:
  conversion-cta-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Syntax and opt-in regression
        run: |
          set -euo pipefail
          for f in src/Production/*.php tests/f253-secondary-local-cta.php; do php -l "$f"; done
          php tests/f253-secondary-local-cta.php
          php tests/f178-safe-section-anchor-navigation.php
          php tests/f247-direct-brief-text-safety.php
          php tests/f249-nav-touch-targets.php
          echo 'No public URL, real contact, consent, provider or deployment.'
