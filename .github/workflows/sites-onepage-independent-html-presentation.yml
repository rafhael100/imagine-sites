name: Sites Onepage independent exact HTML presentation witness (CI only)
'on':
  pull_request:
    types: [opened, synchronize]
    branches: ['test/sites-onepage-final-acceptance-artifact-drift-r01-2026-11-22']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-final-acceptance-artifact-drift-offline.php'
      - '.github/workflows/sites-onepage-independent-html-presentation.yml'
      - 'docs/reviews/SITES-ONEPAGE-INDEPENDENT-PRESENTATION-WITNESS-2026-11-22.md'
permissions:
  contents: read
concurrency:
  group: sites-onepage-independent-html-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  independent-final-presentation:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/onepage-independent-presentation-witness-r02-2026-11-22' &&
      github.event.pull_request.base.ref == 'test/sites-onepage-final-acceptance-artifact-drift-r01-2026-11-22' &&
      github.event.pull_request.base.sha == 'bb9ad1bad415845cfc47db818c7fdc6d0067da9f'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          tools: none
          coverage: none
      - name: Verify exact isolated head, source shape and run synthetic tests
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-final-acceptance-artifact-drift-offline.php
          grep -Fq 'private ?Closure $currentPresentation = null' src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php tests/onepage-final-acceptance-artifact-drift-offline.php | tee "$RUNNER_TEMP/onepage-independent-presentation.log"
          grep -Eq '^ONEPAGE FINAL ACCEPTANCE ARTIFACT DRIFT PASS: [0-9]+ synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/onepage-final-drift.log"
          test ! -e .env.production
          test ! -e /run/secrets/imagine
