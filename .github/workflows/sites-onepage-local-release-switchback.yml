name: Sites Onepage local loopback release switchback (isolated only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/sites-onepage-private-acceptance-artifact-2026-11-20-r33']
    paths:
      - 'tests/onepage-local-release-switchback-offline.php'
      - 'docs/reviews/SITES-ONEPAGE-LOCAL-RELEASE-SWITCHBACK-2026-11-20.md'
      - '.github/workflows/sites-onepage-local-release-switchback.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-local-switchback-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  onepage-switchback:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/sites-onepage-local-release-switchback-2026-11-20-r34' &&
      github.event.pull_request.base.ref == 'test/sites-onepage-private-acceptance-artifact-2026-11-20-r33' &&
      github.event.pull_request.base.sha == '449a118bbeb859ee8b1c9ab57e08c4b7bd0c60b7'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      SITES_ONEPAGE_RELEASE_LOOPBACK_LAB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Test independent loopback SHA after swap and explicit rollback
        run: |
          set -euo pipefail
          php -l tests/onepage-local-release-switchback-offline.php
          php tests/onepage-local-release-switchback-offline.php | tee "$RUNNER_TEMP/onepage-loopback-release.log"
          grep -Eq '^ONEPAGE LOOPBACK RELEASE SWITCHBACK PASS: [0-9]+ synthetic assertions; NO-GO[.]$' "$RUNNER_TEMP/onepage-loopback-release.log"
      - name: Verify scope and refusal of any operational credentials
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -e /run/secrets/imagine
          grep -Fq '127.0.0.1' tests/onepage-local-release-switchback-offline.php
          grep -Fq 'SyntheticPublishCoordinator' tests/onepage-local-release-switchback-offline.php
          grep -Fq 'SyntheticOriginRegistry' tests/onepage-local-release-switchback-offline.php
