name: Sites F1-170 review v4 process section in Laravel
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticProcessReviewComparisonTest.php'
      - 'fixtures/sites/f1-170-process-copy.synthetic.json'
      - '.github/workflows/sites-f1-170-process-review.yml'
permissions:
  contents: read
jobs:
  process-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: PHP lint and fixed sample schema
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticProcessReviewComparisonTest.php
          php -r '$x=json_decode(file_get_contents("fixtures/sites/f1-170-process-copy.synthetic.json"),true,16,JSON_THROW_ON_ERROR);if($x["schemaVersion"]!=="sites.ai-copy.v4" || count($x["processSteps"])!==3)exit(1);'
      - name: Install locked Laravel testing dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Validate v4 pages and unchanged v3 review routes
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticProcessReviewComparisonTest|SyntheticRichReviewComparisonTest|SyntheticRichReviewUiTest|SyntheticRichReviewGalleryExportTest)' --no-ansi
      - name: Scope
        if: always()
        run: echo "No public route, client data, CRM, live AI, accept action or deploy."
