name: Sites F1-168 compose binding + technical HMAC + PG18 nonce safely
on:
  pull_request:
    paths:
      - 'src/Integration/LabSyntheticCrmRequestCoordinator.php'
      - 'src/Integration/LabSyntheticCrmRequestAttemptAssessment.php'
      - 'tests/f168-crm-preflight-nonce-composition-pg18.php'
      - '.github/workflows/sites-f1-168-crm-composition-pg18.yml'
permissions:
  contents: read
jobs:
  synthetic-crm-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f140-fictional-admin-ci-only
          POSTGRES_DB: sites_f140_atomic_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f140_atomic_lab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      SITES_F165_SYNTHETIC_AUTH: '1'
      SITES_F166_AUTHORITY_FENCE: '1'
      SITES_F167_PG_LAB: '1'
      SITES_F168_COMPOSITION_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: sites_f140_atomic_lab
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sites_f140_atomic_lab
      PGUSER: postgres
      PGPASSWORD: f140-fictional-admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          tools: none
          coverage: none
      - name: Install PostgreSQL CLI in ephemeral runner
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap independent nonce ledger in isolated PostgreSQL18
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-167-crm-service-nonce-history.sql
      - name: PHP syntax and transactional synthetic CRM composition tests
        run: |
          set -euo pipefail
          php -l src/Integration/LabSyntheticCrmRequestAttemptAssessment.php
          php -l src/Integration/LabSyntheticCrmRequestCoordinator.php
          php -l tests/f168-crm-preflight-nonce-composition-pg18.php
          php tests/f168-crm-preflight-nonce-composition-pg18.php
      - name: Deny production interpretation
        if: always()
        run: echo "CI-only metadata. Not real IAM, signed service authentication, CRM delivery, durable receipt, consent or deploy."
