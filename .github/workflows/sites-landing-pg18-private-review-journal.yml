name: Sites Landing PG18 private review journal (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['feature/sites-landing-pg18-private-artifact-custody-2026-11-20-r22']
    paths:
      - '.github/workflows/sites-landing-pg18-private-review-journal.yml'
      - 'contracts/portal-sites/candidates/landing-private-review-journal-pg18.sql'
      - 'apps/sites/app/Integration/PortalLandingPageReviewJournalCandidate.php'
      - 'tests/landing-page-pg18-private-review-journal.php'
      - 'docs/reviews/SITES-LANDING-PG18-PRIVATE-REVIEW-JOURNAL-2026-11-20.md'
permissions:
  contents: read
concurrency:
  group: sites-landing-private-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  private-review-journal:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/sites-landing-pg18-private-review-journal-2026-11-20-r23' &&
      github.event.pull_request.base.ref == 'feature/sites-landing-pg18-private-artifact-custody-2026-11-20-r22' &&
      github.event.pull_request.base.sha == '9381228723e024cc62874a4825d92d46c0339687'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      GITHUB_ACTIONS: 'true'
      SITES_LANDING_CUSTODY_CI: '1'
      SITES_LANDING_REVIEW_CI: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-portal
          ref: 4a5e1e06376188f85c90bee3d10056ab3ce2302a
          path: .pinned-portal
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,pdo_pgsql
          coverage: none
      - name: Verify immutable Portal and PHP syntax
        run: |
          set -euo pipefail
          test "$(git -C .pinned-portal rev-parse HEAD)" = 4a5e1e06376188f85c90bee3d10056ab3ce2302a
          php -m | grep -x pdo_pgsql
          php -m | grep -x mbstring
          php -l apps/sites/app/Integration/PortalLandingPageReviewJournalCandidate.php
          php -l tests/landing-page-pg18-private-review-journal.php
          if SITES_LANDING_REVIEW_CI=0 php tests/landing-page-pg18-private-review-journal.php >/dev/null 2>&1; then
            echo 'Unsafe: review fixture ran without explicit CI-only gate'
            exit 1
          fi
      - name: Verify private reviewer journal and previous custody
        run: |
          set -euo pipefail
          php tests/landing-page-pg18-private-review-journal.php | tee review.log
          grep -Eq '^SITES LANDING PG18 PRIVATE CUSTODY PASS: [0-9]+ checks; synthetic admissions only\.$' review.log
          grep -Eq '^SITES LANDING PG18 PRIVATE REVIEW JOURNAL PASS: [0-9]+ checks; synthetic identities, NO RELEASE AUTHORITY\.$' review.log
          echo 'CI ONLY: no publisher, operational approval, client acceptance or payment'
