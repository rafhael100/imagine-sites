name: Sites Onepage private artifact to signed acceptance (isolated only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/sites-onepage-buyer-confirmation-review-link-2026-11-20-r32']
    paths:
      - 'tests/onepage-private-acceptance-chain-offline.php'
      - 'docs/reviews/SITES-ONEPAGE-ACCEPTANCE-ARTIFACT-CHAIN-2026-11-20.md'
      - '.github/workflows/sites-onepage-private-acceptance-chain.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-acceptance-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  synthetic-private-acceptance:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/sites-onepage-private-acceptance-artifact-2026-11-20-r33' &&
      github.event.pull_request.base.ref == 'fix/sites-onepage-buyer-confirmation-review-link-2026-11-20-r32' &&
      github.event.pull_request.base.sha == '3464403f8bb0eede572a2d1558061b9ad5df791e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      SITES_ONEPAGE_ACCEPTANCE_CHAIN_LAB: '1'
      SITES_F391_APPROVAL_LAB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, dom, xml
          coverage: none
      - name: Verify immutable private preview and synthetic acceptance, never publish
        run: |
          set -euo pipefail
          php -l tests/onepage-private-acceptance-chain-offline.php
          php tests/onepage-private-acceptance-chain-offline.php | tee "$RUNNER_TEMP/onepage-private-acceptance-chain.log"
          grep -Eq '^ONEPAGE PREVIEW TO ACCEPTANCE CHAIN PASS: [0-9]+ synthetic assertions; NO-GO[.]$' "$RUNNER_TEMP/onepage-private-acceptance-chain.log"
      - name: Preserve strict isolation and no production binding
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -e /run/secrets/imagine
          grep -Fq "new OnepageBuyerPrivatePreviewCandidate" tests/onepage-private-acceptance-chain-offline.php
          grep -Fq "new SignedPortalClientApprovalGate" tests/onepage-private-acceptance-chain-offline.php
          grep -Fq "hash_file('sha256', $file)" tests/onepage-private-acceptance-chain-offline.php
