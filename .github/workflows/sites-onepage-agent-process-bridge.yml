name: Sites OnePage real AI Agents process boundary (synthetic CI, NO-GO)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/sites-onepage-agent-v1-mock-provenance-2026-11-20-r37']
    paths:
      - 'tests/onepage-agent-process-bridge-offline.php'
      - 'docs/reviews/SITES-ONEPAGE-AGENT-PROCESS-BRIDGE-2026-11-20.md'
      - '.github/workflows/sites-onepage-agent-process-bridge.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-process-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  process-bridge:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/sites-onepage-agents-process-bridge-2026-11-20-r38' &&
      github.event.pull_request.base.ref == 'test/sites-onepage-agent-v1-mock-provenance-2026-11-20-r37' &&
      github.event.pull_request.base.sha == '3045dceb989746b2b945bfd15268dde881a5bf89'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      SITES_ONEPAGE_AGENT_PROCESS_LAB: '1'
      IMAGINE_ONEPAGE_PROCESS_LAB: '1'
    steps:
      - name: Checkout exact Sites PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout pinned public AI Agents PR SHA with no persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-ai-agents
          ref: 3f9ef347e51fe419e75d6582bf7630a51fe371dd
          path: ci-ai-agents
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Real child process to strict Sites renderer and loopback SHA
        run: |
          set -euo pipefail
          php -l ci-ai-agents/src/Integration/OnepageCopyProcessWorker.php
          php -l ci-ai-agents/tools/onepage_copy_process_worker.php
          php -l tests/onepage-agent-process-bridge-offline.php
          php tests/onepage-agent-process-bridge-offline.php | tee "$RUNNER_TEMP/sites-onepage-process.log"
          grep -Eq '^ONEPAGE PROCESS BRIDGE PASS: [0-9]+ synthetic checks; NO-GO; NO OPENAI REQUEST[.]$' "$RUNNER_TEMP/sites-onepage-process.log"
      - name: Offline-only guard
        run: |
          set -euo pipefail
          test ! -e .env.production
          ! grep -Eq 'OPENAI_API_KEY|api[.]openai[.]com|curl_exec|Asaas|Cloudflare' tests/onepage-agent-process-bridge-offline.php
          test ! -e ci-ai-agents/.env
