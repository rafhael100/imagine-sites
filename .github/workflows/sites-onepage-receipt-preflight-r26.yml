name: Sites OnePage R26 preflight before confidential buyer receipt (CI-only)
on:
  push:
    branches: ['fix/onepage-deny-receipt-before-preview-r26-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-receipt-before-preview-r26.php'
      - '.github/workflows/sites-onepage-receipt-preflight-r26.yml'
      - 'docs/reviews/SITES-ONEPAGE-RECEIPT-PREFLIGHT-R26-2026-11-23.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-stop-stale-head-before-receipt-r25-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-receipt-before-preview-r26.php'
      - '.github/workflows/sites-onepage-receipt-preflight-r26.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-r26-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  receipt-preflight:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      (github.event_name == 'push' || (
        github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/onepage-deny-receipt-before-preview-r26-20261123' &&
        github.event.pull_request.base.ref == 'fix/onepage-stop-stale-head-before-receipt-r25-20261123' &&
        github.event.pull_request.base.sha == '113c76caf5f9731126b056ded97944ea196ba73b'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
          tools: none
      - name: Verify exact SHA, lint, R26 preflight and affected R25 regression
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-receipt-before-preview-r26.php
          php -l tests/onepage-stale-release-prevents-receipt-r25.php
          php tests/onepage-receipt-before-preview-r26.php
          php tests/onepage-stale-release-prevents-receipt-r25.php
      - name: Keep operational gates blocked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -d .pinned-portal
          test ! -d .pinned-agents
          test ! -f deploy.sh
