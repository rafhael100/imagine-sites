name: Sites F1-47 durable review replay lab - disposable PostgreSQL
on:
  pull_request:
    paths:
      - 'labs/security/f1-47-review-nonce-schema.sql'
      - 'src/Security/LabReviewHandoffReplayStore.php'
      - 'tests/f47-pg-review.php'
      - '.github/workflows/sites-f1-47-review-replay.yml'
      - 'docs/SITES-F1-47-PG-REVIEW-REPLAY.md'
      - 'src/Security/SyntheticReviewHandoffEnvelope.php'
permissions:
  contents: read
jobs:
  two-connection-review-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nonce-lab-fictional-only
          POSTGRES_DB: sites_auth_replay_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_auth_replay_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SITES_F47_PG_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: nonce-lab-fictional-only
      PGDATABASE: sites_auth_replay_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: pdo,pdo_pgsql
          coverage: none
      - name: Install PostgreSQL CLI only if preinstalled client missing
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap disposable F1-12 plus review-only F1-47 nonce table
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-12-nonce-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/security/f1-47-review-nonce-schema.sql
      - name: PHP syntax
        run: |
          php -l src/Security/LabReviewHandoffReplayStore.php
          php -l tests/f47-pg-review.php
      - name: Verify cross-connection durable review replay and revocation
        run: php tests/f47-pg-review.php
      - name: Only synthetic credentials and database
        if: always()
        run: echo "Disposable PostgreSQL CI. No real HTTP, keys, Portal/customer authority, Cloudflare/VPS or deploy."
