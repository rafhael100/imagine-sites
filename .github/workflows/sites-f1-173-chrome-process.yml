name: Sites F1-173 process section responsiveness in Chromium
on:
  pull_request:
    paths:
      - 'tests/f173-process-chrome-fixtures.php'
      - 'ci/f173_process_cdp.py'
      - '.github/workflows/sites-f1-173-chrome-process.yml'
permissions:
  contents: read
jobs:
  process-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      APP_ENV: testing
      SITES_F173_CHROME_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Lint synthetic PHP fixture and reused native CDP script
        run: |
          set -euo pipefail
          php -l tests/f173-process-chrome-fixtures.php
          python3 -m py_compile ci/f173_process_cdp.py ci/f43_cdp.py ci/f44_contrast.py
      - name: Create twelve private noindex process pages
        run: |
          set -euo pipefail
          php tests/f173-process-chrome-fixtures.php
          test -f /tmp/sites-f173-process-gallery/gallery-manifest.json
      - name: Inspect native numbered steps in desktop and mobile Chrome
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if test -z "$browser"; then
            echo "Preinstalled Chrome unavailable. Do not buy/download external software." >&2
            exit 1
          fi
          "$browser" --version
          python3 ci/f173_process_cdp.py /tmp/sites-f173-process-gallery "$browser"
      - name: Delete fictional files and traces in runner
        if: always()
        run: |
          rm -rf /tmp/sites-f173-process-gallery ci/__pycache__
          echo "No client data, screenshot upload, provider, public site, CRM or deploy."
