name: Sites OnePage R16 private-source preflight (CI-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['test/onepage-chromium-bounded-ledger-r15-2026-11-22']
    paths:
      - 'src/Production/OnepageBuyerPrivatePreviewCandidate.php'
      - 'tests/onepage-private-source-preflight-r16.php'
      - 'tests/onepage-buyer-private-preview-offline.php'
      - '.github/workflows/sites-onepage-private-source-preflight-r16.yml'
      - 'docs/reviews/SITES-ONEPAGE-PRIVATE-SOURCE-PREFLIGHT-R16-2026-11-23.md'
permissions:
  contents: read
concurrency:
  group: onepage-private-source-preflight-r16-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  preview-private-read-preflight:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/onepage-preflight-private-source-r16-20261123' &&
      github.event.pull_request.base.ref == 'test/onepage-chromium-bounded-ledger-r15-2026-11-22' &&
      github.event.pull_request.base.sha == 'cbf7826cb11df72a5046753cb5ebef4859058eb8'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
      - name: Verify preflight and affected acceptance regression
        run: |
          set -euo pipefail
          php -l src/Production/OnepageBuyerPrivatePreviewCandidate.php
          php -l tests/onepage-private-source-preflight-r16.php
          php tests/onepage-private-source-preflight-r16.php | tee "$RUNNER_TEMP/onepage-r16.log"
          grep -Eq '^ONEPAGE PRIVATE SOURCE PREFLIGHT R16 PASS: [0-9]+ checks; isolated mock ports; NO-GO[.]$' "$RUNNER_TEMP/onepage-r16.log"
          php tests/onepage-final-acceptance-artifact-drift-offline.php
      - name: No credential or operational publisher
        run: |
          set -euo pipefail
          test ! -d .pinned-portal
          test ! -f .env.production
