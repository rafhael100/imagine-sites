name: Sites F1-23 Portal-Sites cross-repository PHP contract (synthetic only)

on:
  pull_request:
    paths:
      - 'tests/f23-cross-repo.php'
      - 'src/Security/SyntheticVersionedSignedCommand.php'
      - 'src/Security/SyntheticCommercialEpochSignedCommand.php'
      - 'docs/SITES-F1-124-COMMERCIAL-EPOCH-HMAC-V3-PARITY.md'
      - 'docs/SITES-F1-119-PORTAL-V2-HMAC-CROSS-REPO.md'
      - 'docs/SITES-F1-121-PORTAL-TRUST-SOURCE-CROSS-REPO.md'
      - 'docs/SITES-F1-122-PORTAL-COMMERCIAL-FINAL-FENCE.md'
      - 'docs/SITES-F1-123-PORTAL-COMMERCIAL-EPOCH-ABA.md'
      - 'src/Integration/CurrentPortalProjectAuthorizationSnapshot.php'
      - 'src/Integration/SiteProjectCommand.php'
      - 'src/Integration/SnapshotBoundPortalProjectAuthorityGateway.php'
      - '.github/workflows/sites-f1-23-cross-repo-contract.yml'
      - 'docs/SITES-F1-23-PORTAL-CROSS-REPO-COMPAT.md'

permissions:
  contents: read

jobs:
  cross-repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      SITES_F1_23_CROSS_REPO: '1'
      SITES_F1_23_PORTAL_PATH: '/home/runner/work/imagine-sites/imagine-sites/portal-candidate'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned PUBLIC Portal candidate source (no production credentials)
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 8d1e20bc5c39dc4106b549c5e979351b5c766615
          path: portal-candidate
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: mbstring
          coverage: none
      - name: Verify pinned public source identity
        run: |
          set -euo pipefail
          test "$(git -C portal-candidate rev-parse HEAD)" = 8d1e20bc5c39dc4106b549c5e979351b5c766615
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesEnvelopeSigner.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesVersionedEnvelopeSigner.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesCommercialEpochSignedEnvelopeSigner.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/LabPortalSitesVersionedIssuer.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/PortalSiteCommercialEpochSource.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/DenyingPortalSiteCommercialEpochSource.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/PortalSitesSigningMaterialSource.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/CandidatePortalSitesSigningMaterial.php
          test -f portal-candidate/apps/portal/app/Domain/SitesIntegration/DenyingPortalSitesSigningMaterialSource.php
      - name: Syntax check independent code from both repositories
        run: |
          php -l tests/f23-cross-repo.php
          php -l src/Security/SyntheticVersionedSignedCommand.php
          php -l src/Security/SyntheticCommercialEpochSignedCommand.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesEnvelopeSigner.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesVersionedEnvelopeSigner.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesCommercialEpochSignedEnvelopeSigner.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/LabPortalSitesVersionedIssuer.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/PortalSiteCommercialEpochSource.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/DenyingPortalSiteCommercialEpochSource.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/PortalSitesSigningMaterialSource.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/CandidatePortalSitesSigningMaterial.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/DenyingPortalSitesSigningMaterialSource.php
          php -l portal-candidate/apps/portal/app/Domain/SitesIntegration/SitesCreateProjectEncoder.php
      - name: Run real candidate class interoperability tests (in-memory fake authority)
        run: php tests/f23-cross-repo.php
      - name: State limits and no operational side effect
        if: always()
        run: echo "Pinned public Portal candidate classes, fictional source, no API, no key vault, no client data or deploy."
