name: Sites F1-261 branded CTA Laravel review matrix
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticBrandedCtaReviewTest.php'
      - '.github/workflows/sites-f1-261-branded-cta-review.yml'
permissions:
  contents: read
jobs:
  branded-cta-private-laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Lint and install pinned Laravel
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticBrandedCtaReviewTest.php
          cd apps/sites
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Validate 96 palette screens and legacy reviewer in-process
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticBrandedCtaReviewTest|SyntheticSecondaryCtaReviewTest)' --no-ansi
      - name: No publication authority
        if: always()
        run: echo 'Local readonly lab only; no client action, external forms, production credentials or deploy.'
