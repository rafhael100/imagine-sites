name: Sites OnePage R24 typed associative rereads (CI-only)
on:
  push:
    branches: ['fix/onepage-acceptance-associative-order-r24-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-acceptance-associative-order-r24.php'
      - '.github/workflows/sites-onepage-acceptance-associative-r24.yml'
      - 'docs/reviews/SITES-ONEPAGE-ACCEPTANCE-ORDER-R24-2026-11-23.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['fix/onepage-exact-acceptance-port-output-r23-20261123']
    paths:
      - 'src/Production/OnepageExactFinalAcceptanceReadCandidate.php'
      - 'tests/onepage-acceptance-associative-order-r24.php'
      - '.github/workflows/sites-onepage-acceptance-associative-r24.yml'
permissions:
  contents: read
concurrency:
  group: sites-onepage-r24-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  typed-rereads:
    if: >-
      github.repository == 'rafhael100/imagine-sites' &&
      (github.event_name == 'push' || (
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/onepage-acceptance-associative-order-r24-20261123' &&
      github.event.pull_request.base.ref == 'fix/onepage-exact-acceptance-port-output-r23-20261123' &&
      github.event.pull_request.base.sha == 'd3b0509ca8bcef82d2d3f240c994d0fdea51e362'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none
          tools: none
      - name: Verify exact SHA, lint, and new typed-order regression
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          php -l src/Production/OnepageExactFinalAcceptanceReadCandidate.php
          php -l tests/onepage-acceptance-associative-order-r24.php
          php tests/onepage-acceptance-associative-order-r24.php | tee "$RUNNER_TEMP/r24.log"
          grep -Eq '^ONEPAGE ACCEPTANCE ORDER R24 PASS: [1-9][0-9]* synthetic checks; NO-GO[.]$' "$RUNNER_TEMP/r24.log"
      - name: Assert no production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env.production
          test ! -d .pinned-portal
