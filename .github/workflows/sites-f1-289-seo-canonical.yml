name: Sites F1-289 canonical SEO review map (offline)
on:
  pull_request:
    paths:
      - 'src/Domain/SyntheticSeoCanonicalMapV1.php'
      - 'tests/f289-seo-canonical-map.php'
      - '.github/workflows/sites-f1-289-seo-canonical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-seo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Validate offline SEO map
        run: |
          php -l src/Domain/SyntheticSeoCanonicalMapV1.php
          php -l tests/f289-seo-canonical-map.php
          php tests/f289-seo-canonical-map.php
