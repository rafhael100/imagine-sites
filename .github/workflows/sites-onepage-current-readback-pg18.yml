          grep -q '^PROJECT INTAKE RECEIVER CLI PATHS CLEANUP OK:' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^Own disposable release registry cluster inactive;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
 "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -Eq '^ONEPAGE STORED REVIEW PG18 PASS: [0-9]+ checks; tenant-scoped current reader; zero real approval or publication[.]$' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^BRIEF ARTIFACT PROVENANCE CI PASS: 119 new assertions; 923 existing assertions retained[.]' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^BRIEF ARTIFACT INSPECTION CI PASS: 25 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^BRIEF ARTIFACT REGISTRATION CI PASS: 27 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^BRIEF SNAPSHOT RECEIVER CI PASS: 29 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^BRIEF SNAPSHOT INSPECTION CI PASS: 26 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^PROJECT INTAKE RECEIVER CLI CI PASS: 29 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^PROJECT INTAKE RECOVERY CLI CI PASS: 30 assertions;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
          grep -q '^PUBLICATION REQUEST READER CI PASS: 33 assertions; 1208 existing assertions retained;' "$RUNNER_TEMP/sites-publication-request-recovery.log"
