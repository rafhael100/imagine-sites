name: Sites F1-19 Laravel command+outbox PostgreSQL 18 integration lab
on:
  pull_request:
    paths:
      - 'apps/sites/app/Labs/ProjectOutboxLabService.php'
      - 'apps/sites/tests/Feature/LabProjectOutboxPgTest.php'
      - 'labs/postgres/f1-05-schema.sql'
      - 'labs/postgres/f1-15-command-outbox-schema.sql'
      - '.github/workflows/sites-f1-19-laravel-db-lab.yml'
      - 'docs/SITES-F1-19-LARAVEL-DB-LAB.md'
permissions:
  contents: read
jobs:
  laravel-db-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      APP_ENV: testing
      SITES_F1_19_PG_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: sites-outbox-lab-fictional-only
      PGDATABASE: sites_lab
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sites-outbox-lab-fictional-only
          POSTGRES_DB: sites_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,xml,dom,curl,pdo,pdo_pgsql
          coverage: none
      - name: Ensure psql
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap disposable lab schema and command/outbox
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-05-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-15-command-outbox-schema.sql
      - name: Validate and install locked Laravel dependencies
        working-directory: apps/sites
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Syntax check
        run: |
          php -l apps/sites/app/Labs/ProjectOutboxLabService.php
          php -l apps/sites/tests/Feature/LabProjectOutboxPgTest.php
      - name: Verify Laravel transactions, database RLS, idempotency and revocation
        working-directory: apps/sites
        run: php artisan test --filter=LabProjectOutboxPgTest --no-ansi
      - name: Lab only statement
        if: always()
        run: echo "Synthetic PostgreSQL role switch solely in CI, no real Laravel migrations, customers, secrets, or deploy."
