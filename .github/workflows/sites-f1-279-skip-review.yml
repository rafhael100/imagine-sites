name: Sites F1-279 private Laravel keyboard skip-link review
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticSkipNavigationReviewTest.php'
      - '.github/workflows/sites-f1-279-skip-review.yml'
permissions:
  contents: read
jobs:
  private-skip-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Syntax and locked Laravel dependency installation
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticSkipNavigationReviewTest.php
          cd apps/sites
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify private read-only reviewer and prior FAQ/CTA review
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticSkipNavigationReviewTest|SyntheticFaqDisclosureReviewTest|SyntheticSecondaryCtaReviewTest)' --no-ansi
      - name: Scope
        if: always()
        run: echo 'Only fictional localhost read-only Laravel reviewer; no clients, public HTTP endpoint, CRM or deploy.'
