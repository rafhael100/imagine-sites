name: Sites F1-260 branded secondary CTA palette and integrity
on:
  pull_request:
    paths:
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/SyntheticPrivateSecondaryCtaParityV1.php'
      - 'src/Production/SyntheticBrandPaletteV1.php'
      - 'tests/f260-branded-secondary-cta.php'
      - '.github/workflows/sites-f1-260-branded-cta.yml'
permissions:
  contents: read
jobs:
  branded-cta-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Syntax and exact branded CTA layout integrity
        run: |
          set -euo pipefail
          php -l src/Production/StaticSiteRenderer.php
          php -l src/Production/SyntheticPrivateSecondaryCtaParityV1.php
          php -l tests/f260-branded-secondary-cta.php
          php tests/f260-branded-secondary-cta.php
          php tests/f253-secondary-local-cta.php
          php tests/f257-cta-private-package-parity.php
      - name: Scope
        if: always()
        run: echo 'Only private fictional HTML, no live site, CRM, Portal authority, data collection or deploy.'
