name: Sites P0 private staging infrastructure - disposable CI only
on:
  pull_request:
    paths: ['ops/staging/**','apps/sites/app/Support/MountedSecret.php','apps/sites/config/**','tests/test_sites_staging_inventory.py','.github/workflows/sites-p0-private-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITES_STAGING_PORT: '18097'
      SITES_PRIVATE_URL: https://localhost:18097
      SITES_SECRETS_DIR: ${{ runner.temp }}/sites-private-secrets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify read-only port planner
        run: python3 -m unittest discover -s tests -p test_sites_staging_inventory.py
      - name: Generate one-run secrets and transport identities without output
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$SITES_SECRETS_DIR"
          openssl rand -hex 32 > "$SITES_SECRETS_DIR/owner-password"
          openssl rand -hex 32 > "$SITES_SECRETS_DIR/runtime-password"
          printf 'base64:%s\n' "$(openssl rand -base64 32)" > "$SITES_SECRETS_DIR/app-key"
          access_password="$(openssl rand -hex 24)"
          printf '%s' "$access_password" > "$RUNNER_TEMP/sites-access-password"
          printf 'ci-reviewer:%s\n' "$(openssl passwd -6 "$access_password")" > "$SITES_SECRETS_DIR/access.htpasswd"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Sites-Server-CI-CA -keyout "$SITES_SECRETS_DIR/server-ca.key" -out "$SITES_SECRETS_DIR/server-ca.pem" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj /CN=proxy -keyout "$SITES_SECRETS_DIR/server.key" -out "$RUNNER_TEMP/sites-server.csr" 2>/dev/null
          printf 'subjectAltName=DNS:localhost,DNS:proxy\nextendedKeyUsage=serverAuth\n' > "$RUNNER_TEMP/sites-server.ext"
          openssl x509 -req -in "$RUNNER_TEMP/sites-server.csr" -CA "$SITES_SECRETS_DIR/server-ca.pem" -CAkey "$SITES_SECRETS_DIR/server-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/sites-server.ext" -out "$SITES_SECRETS_DIR/server.pem" 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Sites-Portal-CI-CA -keyout "$SITES_SECRETS_DIR/portal-ca.key" -out "$SITES_SECRETS_DIR/portal-ca.pem" 2>/dev/null
          for identity in portal wrong; do
            openssl req -newkey rsa:2048 -nodes -subj "/CN=$identity" -keyout "$SITES_SECRETS_DIR/$identity.key" -out "$RUNNER_TEMP/$identity.csr" 2>/dev/null
            printf 'extendedKeyUsage=clientAuth\n' > "$RUNNER_TEMP/$identity.ext"
            openssl x509 -req -in "$RUNNER_TEMP/$identity.csr" -CA "$SITES_SECRETS_DIR/portal-ca.pem" -CAkey "$SITES_SECRETS_DIR/portal-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/$identity.ext" -out "$SITES_SECRETS_DIR/$identity.pem" 2>/dev/null
          done
          issuer="$(openssl x509 -in "$SITES_SECRETS_DIR/portal.pem" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          serial="$(openssl x509 -in "$SITES_SECRETS_DIR/portal.pem" -noout -serial | cut -d= -f2)"
          printf '"%s|%s" 1;\n' "$issuer" "$serial" > "$SITES_SECRETS_DIR/portal-identities.map"
          # Isolated ephemeral CI only. Vault permissions/UIDs require operator review on VPS.
          chmod 444 "$SITES_SECRETS_DIR"/*
          docker compose -f ops/staging/compose.yaml config --quiet
      - name: Build isolated candidate images
        run: docker compose -f ops/staging/compose.yaml build app proxy
      - name: Start own database and apply reviewed additive schema as bootstrap owner
        run: |
          set -euo pipefail
          docker compose -f ops/staging/compose.yaml up -d --wait db
          docker compose -f ops/staging/compose.yaml run --rm --no-deps \
            -v "$SITES_SECRETS_DIR/owner-password:/run/secrets/migration_owner:ro" \
            -e DB_USERNAME=sites_bootstrap -e SITES_DB_PASSWORD_FILE=/run/secrets/migration_owner \
            app php artisan migrate --force --no-interaction
          docker compose -f ops/staging/compose.yaml run --rm --no-deps \
            -v "$SITES_SECRETS_DIR/owner-password:/run/secrets/migration_owner:ro" \
            -e DB_USERNAME=sites_bootstrap -e SITES_DB_PASSWORD_FILE=/run/secrets/migration_owner \
            -e SITES_NEW_DATABASE_PROVISION=new-isolated-sites-database \
            app php provision-runtime.php
      - name: Verify app isolation and private HTTPS; all operational routes denied
        run: |
          set -euo pipefail
          docker compose -f ops/staging/compose.yaml up -d --wait app proxy
          docker compose -f ops/staging/compose.yaml exec -T app php verify-runtime.php
          for attempt in $(seq 1 20); do
            status="$(curl --connect-timeout 2 --max-time 4 --cacert "$SITES_SECRETS_DIR/server-ca.pem" -sS -o /dev/null -w '%{http_code}' https://localhost:18097/ || true)"
            if test "$status" = 401; then break; fi
            sleep 1
          done
          test "$status" = 401
          access_password="$(cat "$RUNNER_TEMP/sites-access-password")"
          curl --connect-timeout 2 --max-time 5 --cacert "$SITES_SECRETS_DIR/server-ca.pem" --user "ci-reviewer:$access_password" -fsS https://localhost:18097/ | grep -q 'NO-GO operacional'
          curl --connect-timeout 2 --max-time 5 --cacert "$SITES_SECRETS_DIR/server-ca.pem" --user "ci-reviewer:$access_password" -fsS https://localhost:18097/up >/dev/null
          for path in .env index.php _ci/sites/v1/admit _lab/sites/v1/create-project _private/health api/sites/v1/create-project; do
            test "$(curl --connect-timeout 2 --max-time 5 --cacert "$SITES_SECRETS_DIR/server-ca.pem" --user "ci-reviewer:$access_password" -sS -o /dev/null -w '%{http_code}' "https://localhost:18097/$path")" = 404
          done
          docker compose -f ops/staging/compose.yaml exec -T proxy nginx -t
      - name: Verify private mTLS identity without operational authority
        run: |
          set -euo pipefail
          docker pull curlimages/curl:8.12.1 >/dev/null
          probe() {
            docker run --rm --network imagine-sites-p0-staging_s2s_private \
              -v "$SITES_SECRETS_DIR/server-ca.pem:/ca.pem:ro" \
              -v "$SITES_SECRETS_DIR/${1}.pem:/client.pem:ro" \
              -v "$SITES_SECRETS_DIR/${1}.key:/client.key:ro" \
              curlimages/curl:8.12.1 --connect-timeout 2 --max-time 5 --cacert /ca.pem --cert /client.pem --key /client.key \
              -sS -o /dev/null -w '%{http_code}' "https://proxy:9443/${2}"
          }
          test "$(probe portal _private/health)" = 200
          test "$(probe wrong _private/health)" = 403
          test "$(probe portal _private/sites/v1/admit)" = 503
          test "$(docker run --rm --network imagine-sites-p0-staging_s2s_private \
            -v "$SITES_SECRETS_DIR/server-ca.pem:/ca.pem:ro" curlimages/curl:8.12.1 \
            --connect-timeout 2 --max-time 5 --cacert /ca.pem -sS -o /dev/null -w '%{http_code}' https://proxy:9443/_private/health)" = 400
      - name: Rehearse encrypted backup and restore in disposable database only
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/sites-backup-key"
          docker compose -f ops/staging/compose.yaml exec -T db sh -c \
            'PGPASSWORD="$(cat /run/secrets/owner_password)" pg_dump -U sites_bootstrap -d sites_staging -Fc' \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/sites-backup-key" -out "$RUNNER_TEMP/sites-backup.enc"
          docker compose -f ops/staging/compose.yaml exec -T db sh -c \
            'PGPASSWORD="$(cat /run/secrets/owner_password)" createdb -U sites_bootstrap sites_restore_ci'
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/sites-backup-key" -in "$RUNNER_TEMP/sites-backup.enc" \
            | docker compose -f ops/staging/compose.yaml exec -T db sh -c \
              'PGPASSWORD="$(cat /run/secrets/owner_password)" pg_restore -U sites_bootstrap -d sites_restore_ci --exit-on-error'
          test "$(docker compose -f ops/staging/compose.yaml exec -T db sh -c \
            'PGPASSWORD="$(cat /run/secrets/owner_password)" psql -U sites_bootstrap -d sites_restore_ci -Atc "SELECT bool_and(c.relrowsecurity AND c.relforcerowsecurity) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='"'"'sites_core'"'"' AND c.relkind='"'"'r'"'"'"')" = t
          echo 'PASS: isolated staging infrastructure only; no operational Portal, Asaas, acceptance, publication or VPS proof.'
      - name: Remove only disposable CI project and ephemeral secrets
        if: always()
        run: |
          docker compose -f ops/staging/compose.yaml down -v --remove-orphans || true
          chmod -R u+w "$SITES_SECRETS_DIR" 2>/dev/null || true
          rm -rf "$SITES_SECRETS_DIR"
          rm -f "$RUNNER_TEMP/sites-access-password" "$RUNNER_TEMP/sites-backup-key" "$RUNNER_TEMP/sites-backup.enc"
