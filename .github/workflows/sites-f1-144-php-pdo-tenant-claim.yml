name: Sites F1-144 PHP/PDO tenant-bound claim (disposable PG18)
on:
  pull_request:
    paths:
      - 'src/Integration/LabPostgresTenantBoundCrmClaim.php'
      - 'src/Integration/LabTenantBoundCrmClaimAssessment.php'
      - 'tests/f144-pdo-tenant-bound-claim.php'
      - '.github/workflows/sites-f1-144-php-pdo-tenant-claim.yml'
permissions:
  contents: read
jobs:
  scoped-claim-php-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f140-fictional-admin-ci-only
          POSTGRES_DB: sites_f140_atomic_lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_f140_atomic_lab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      SITES_F140_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: sites_f140_atomic_lab
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sites_f140_atomic_lab
      PGUSER: postgres
      PGPASSWORD: f140-fictional-admin-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo,pdo_pgsql
          coverage: none
          tools: none
      - name: Prepare disposable PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Initialize tenant-scoped and revocable CI fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-140-atomic-binding-claim.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-141-monotonic-binding-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-142-db-login-tenant-fence.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/postgres/f1-143-login-revocation-fence.sql
      - name: PHP lint, claim replay, revocation and no-authority tests
        run: |
          set -euo pipefail
          php -l src/Integration/LabTenantBoundCrmClaimAssessment.php
          php -l src/Integration/LabPostgresTenantBoundCrmClaim.php
          php -l tests/f144-pdo-tenant-bound-claim.php
          php tests/f144-pdo-tenant-bound-claim.php
      - name: CI fixture only
        if: always()
        run: echo "No Portal IAM, CRM API/ACK, PII, VPS, DNS or production operations."
