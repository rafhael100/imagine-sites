name: Sites F1-285 Laravel private keyboard skip-link reviewer
on:
  pull_request:
    paths:
      - 'apps/sites/routes/web.php'
      - 'apps/sites/resources/views/labs/review.blade.php'
      - 'apps/sites/tests/Feature/SyntheticSkipLinkReviewTest.php'
      - '.github/workflows/sites-f1-285-skip-review.yml'
permissions:
  contents: read
jobs:
  private-skip-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Lint routes and install pinned Laravel dependencies
        run: |
          set -euo pipefail
          php -l apps/sites/routes/web.php
          php -l apps/sites/tests/Feature/SyntheticSkipLinkReviewTest.php
          cd apps/sites
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Review 24 skip-link variants and prior private FAQ reviewer
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticSkipLinkReviewTest|SyntheticFaqDisclosureReviewTest|SyntheticSecondaryCtaReviewTest)' --no-ansi
      - name: Scope
        if: always()
        run: echo 'In-process 127.0.0.1 read-only synthetic review. No public route, data, CRM, client, network or deploy.'
