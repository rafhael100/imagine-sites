name: Sites F1-238 six inert demonstration pages as an expiring CI artifact
on:
  pull_request:
    paths:
      - 'ci/f238_generate_demo_gallery.php'
      - 'fixtures/sites/f1-06-onepage.synthetic.json'
      - 'fixtures/sites/f1-170-process-copy.synthetic.json'
      - 'ci/f243_verify_rich_demo.php'
      - 'ci/f245_verify_copy_review_gate.php'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'src/Production/StructuredCopyCandidate.php'
      - 'docs/SITES-F1-245-COPY-TO-REVIEW-E2E.md'
      - 'docs/SITES-F1-243-RICH-DEMO-GALLERY.md'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/SiteBrief.php'
      - 'src/Production/InertPreviewAudit.php'
      - '.github/workflows/sites-f1-238-demo-gallery-artifact.yml'
      - 'docs/SITES-F1-238-DEMO-GALLERY.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-demo-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      GITHUB_ACTIONS: 'true'
      SITES_F238_DEMO_ARTIFACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,dom,xml
          coverage: none
      - name: Install exact locked PHP dependencies without package scripts
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Build and verify six fixed fictional HTML pages
        run: |
          set -euo pipefail
          php -l ci/f238_generate_demo_gallery.php
          php ci/f238_generate_demo_gallery.php
          php -l ci/f243_verify_rich_demo.php
          php ci/f243_verify_rich_demo.php
          php -l ci/f245_verify_copy_review_gate.php
          php ci/f245_verify_copy_review_gate.php
          cd apps/sites/storage/app/private/f238-demo-previews
          test "$(find . -maxdepth 1 -type f | wc -l)" = 10
          sha256sum -c SHA256SUMS
          grep -Fq '"publishable": false' manifest.json
          grep -Fq '"approvedForClient": false' manifest.json
          for html in ./*.html; do
            grep -qi 'noindex' "$html"
            if grep -Eqi '<form|<script|https?://' "$html"; then
              echo 'Unsafe external or active content in fictional demo'
              exit 1
            fi
          done
      - name: Upload fictional HTML gallery for temporary manual review
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: imagine-sites-demo-gallery-fictional
          path: apps/sites/storage/app/private/f238-demo-previews/
          retention-days: 7
          if-no-files-found: error
      - name: Delete generated sample material from runner
        if: always()
        run: rm -rf apps/sites/storage/app/private/f238-demo-previews
      - name: Delimit preview from publication
        if: always()
        run: echo 'Synthetic HTML only; artifact download is NOT Cloudflare publishing, customer approval, CRM capture, or deployment.'
