name: Sites F1-238 six inert demonstration pages as an expiring CI artifact
on:
  pull_request:
    paths:
      - 'ci/f238_generate_demo_gallery.php'
      - 'fixtures/sites/f1-06-onepage.synthetic.json'
      - 'fixtures/sites/f1-170-process-copy.synthetic.json'
      - 'ci/f243_verify_rich_demo.php'
      - 'ci/f245_verify_copy_review_gate.php'
      - 'ci/f248_verify_source_provenance.php'
      - 'src/Production/SyntheticDraftProvenanceV1.php'
      - 'docs/SITES-F1-248-SOURCE-PROVENANCE.md'
      - 'ci/f246_php_manifest_parity.py'
      - 'docs/SITES-F1-246-CROSS-PHP-RELEASE-HASH-PARITY.md'
      - 'src/Production/SyntheticStructuredDraftAssembly.php'
      - 'src/Production/StructuredCopyCandidate.php'
      - 'docs/SITES-F1-245-COPY-TO-REVIEW-E2E.md'
      - 'docs/SITES-F1-243-RICH-DEMO-GALLERY.md'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/SiteBrief.php'
      - 'src/Production/InertPreviewAudit.php'
      - '.github/workflows/sites-f1-238-demo-gallery-artifact.yml'
      - 'docs/SITES-F1-238-DEMO-GALLERY.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-demo-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      GITHUB_ACTIONS: 'true'
      SITES_F238_DEMO_ARTIFACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring,dom,xml
          coverage: none
      - name: Install exact locked PHP dependencies without package scripts
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Build and verify six fixed fictional HTML pages
        run: |
          set -euo pipefail
          php -l ci/f238_generate_demo_gallery.php
          php ci/f238_generate_demo_gallery.php
          php -l ci/f243_verify_rich_demo.php
          php ci/f243_verify_rich_demo.php
          php -l ci/f245_verify_copy_review_gate.php
          php ci/f245_verify_copy_review_gate.php
          php -l ci/f248_verify_source_provenance.php
          php ci/f248_verify_source_provenance.php
          cd apps/sites/storage/app/private/f238-demo-previews
          test "$(find . -maxdepth 1 -type f | wc -l)" = 10
          sha256sum -c SHA256SUMS
          grep -Fq '"publishable": false' manifest.json
          grep -Fq '"approvedForClient": false' manifest.json
          for html in ./*.html; do
            grep -qi 'noindex' "$html"
            if grep -Eqi '<form|<script|https?://' "$html"; then
              echo 'Unsafe external or active content in fictional demo'
              exit 1
            fi
          done
      - name: Preserve small synthetic SHA manifest from this PHP version
        uses: actions/upload-artifact@v4
        with:
          name: sites-f246-manifest-php-${{ matrix.php }}
          path: apps/sites/storage/app/private/f238-demo-previews/manifest.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload fictional HTML gallery for temporary manual review
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: imagine-sites-demo-gallery-fictional
          path: apps/sites/storage/app/private/f238-demo-previews/
          retention-days: 7
          if-no-files-found: error
      - name: Delete generated sample material from runner
        if: always()
        run: rm -rf apps/sites/storage/app/private/f238-demo-previews
      - name: Delimit preview from publication
        if: always()
        run: echo 'Synthetic HTML only; artifact download is NOT Cloudflare publishing, customer approval, CRM capture, or deployment.'
  php83-php84-content-parity:
    name: Verify identical six release digests on PHP 8.3 and 8.4
    runs-on: ubuntu-24.04
    needs: offline-demo-gallery
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable synthetic digest lists from PHP 8.3
        uses: actions/download-artifact@v4
        with:
          name: sites-f246-manifest-php-8.3
          path: ${{ runner.temp }}/sites-php83
      - name: Fetch immutable synthetic digest lists from PHP 8.4
        uses: actions/download-artifact@v4
        with:
          name: sites-f246-manifest-php-8.4
          path: ${{ runner.temp }}/sites-php84
      - name: Deny any drift in gallery or page SHA-256 across PHP versions
        run: |
          set -euo pipefail
          python3 -m py_compile ci/f246_php_manifest_parity.py
          python3 ci/f246_php_manifest_parity.py --self-test
          python3 ci/f246_php_manifest_parity.py \
            --left "$RUNNER_TEMP/sites-php83/manifest.json" \
            --right "$RUNNER_TEMP/sites-php84/manifest.json"
          cmp "$RUNNER_TEMP/sites-php83/manifest.json" "$RUNNER_TEMP/sites-php84/manifest.json"
      - name: Delete the two comparison manifests
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sites-php83" "$RUNNER_TEMP/sites-php84"
      - name: Scope
        if: always()
        run: echo 'Cross-PHP reproducibility of fictional private HTML only, not signed release/client approval/production deployment.'
