name: Sites F1-175 controlled optional section ordering
on:
  pull_request:
    paths:
      - 'src/Production/SiteBrief.php'
      - 'src/Production/StaticSiteRenderer.php'
      - 'src/Production/SyntheticSectionOrderRevisionPlan.php'
      - 'src/Production/SyntheticStyleRevisionPlan.php'
      - 'src/Production/SyntheticContentRevisionPlan.php'
      - 'src/Production/SyntheticEditorialPatchV1.php'
      - 'tests/f175-static-section-order.php'
      - '.github/workflows/sites-f1-175-section-order.yml'
permissions:
  contents: read
jobs:
  section-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom
          tools: none
          coverage: none
      - name: Lint strict renderer and revision classes
        run: |
          set -euo pipefail
          php -l src/Production/SiteBrief.php
          php -l src/Production/StaticSiteRenderer.php
          php -l src/Production/SyntheticSectionOrderRevisionPlan.php
          php -l src/Production/SyntheticEditorialPatchV1.php
          php -l tests/f175-static-section-order.php
      - name: Verify six layout permutations, immutable review, legacy bytes
        run: |
          set -euo pipefail
          php tests/f175-static-section-order.php
          php tests/f157-static-faq-content.php
          php tests/f159-services-highlights-ai-copy-v3.php
          php tests/f169-process-steps-copy-v4.php
          php tests/f171-editorial-patch.php
          echo "No editable public site or operational approval is implied."
