name: Sites F1-185 canonical review bundle parity
on:
  pull_request:
    paths:
      - 'src/Production/SyntheticPrivateReviewPackageV1.php'
      - 'apps/sites/routes/console.php'
      - 'apps/sites/tests/Feature/SyntheticReviewNavigationMatrixTest.php'
      - 'tests/f185-canonical-private-package.php'
      - '.github/workflows/sites-f1-185-canonical-bundle.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  canonical-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,curl,pdo,pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: PHP syntax checks
        run: |
          set -euo pipefail
          php -l src/Production/SyntheticPrivateReviewPackageV1.php
          php -l tests/f185-canonical-private-package.php
          php -l apps/sites/routes/console.php
          php -l apps/sites/tests/Feature/SyntheticReviewNavigationMatrixTest.php
      - name: Verify canonical bytes and deliberately forged records
        run: php tests/f185-canonical-private-package.php
      - name: Install locked Laravel dependencies
        working-directory: apps/sites
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify both export routes and legacy navigation
        working-directory: apps/sites
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test --filter='(SyntheticEditedPrivateBundleTest|SyntheticCombinedLayoutPrivateBundleTest|SyntheticReviewNavigationMatrixTest)' --no-ansi
      - name: Boundary
        if: always()
        run: echo "Pure fictional pending drafts, no client editor, CRM, official acceptance or deploy."
