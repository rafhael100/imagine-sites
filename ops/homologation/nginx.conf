# F1-373: localhost-bound staging proxy, NOT a publicly exposed ingress.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/sites/public;
    index index.php;
    client_max_body_size 1m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass sites-php:9000;
        fastcgi_param SCRIPT_FILENAME /srv/sites/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/sites/public;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 15s;
    }

    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { return 404; }
}
