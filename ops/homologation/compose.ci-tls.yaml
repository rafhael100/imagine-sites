# F1-379 TEST-ONLY overlay on top of F1-373 and F1-376. Never deploy.
# Both CA and server key are generated per CI job. NO fixed secret in git.
# Refuses interpolation without explicit CI opt-in and TLS directory.
services:
  sites-php:
    environment:
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/pg-ca/ca.crt
      PGSSLROOTCERT: /run/pg-ca/ca.crt
      PGSSLMODE: verify-full
      SITES_F379_TLS_LAB: ${SITES_F379_TLS_LAB:?Explicit disposable CI TLS opt-in required}
    volumes:
      - ${SITES_F379_TLS_DIR:?Temporary CI TLS path required}/ca.crt:/run/pg-ca/ca.crt:ro
      - ${SITES_F379_TLS_DIR:?Temporary CI TLS path required}/wrong-ca.crt:/run/pg-ca/wrong-ca.crt:ro
  sites-db:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pg-tls/server.crt
      - -c
      - ssl_key_file=/run/pg-tls/server.key
      - -c
      - ssl_ca_file=/run/pg-tls/ca.crt
      - -c
      - hba_file=/run/pg-tls/pg_hba.conf
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - ${SITES_F379_TLS_DIR:?Temporary CI TLS path required}/ca.crt:/run/pg-tls/ca.crt:ro
      - ${SITES_F379_TLS_DIR:?Temporary CI TLS path required}/server.crt:/run/pg-tls/server.crt:ro
      - ${SITES_F379_TLS_DIR:?Temporary CI TLS path required}/server.key:/run/pg-tls/server.key:ro
      - ./ci-pg_hba.conf:/run/pg-tls/pg_hba.conf:ro
