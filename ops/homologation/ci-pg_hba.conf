# F1-379: CI-ONLY disposable PG18 connections. Not a production HBA.
# Temporary initdb service can bootstrap by local Unix socket.
local   all             all                                     trust
# Network connections MUST use TLS, even when the caller asks to disable SSL.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
