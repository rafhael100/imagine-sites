server {
 listen 8443 ssl;
 server_name _;
 ssl_certificate /run/secrets/tls_certificate;
 ssl_certificate_key /run/secrets/tls_key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 auth_basic "Imagine Sites private staging";
 auth_basic_user_file /run/secrets/access_passwords;
 add_header X-Robots-Tag "noindex, nofollow" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 location = / {root /opt/imagine/status; try_files /index.html =404;}
 location = /up {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /opt/imagine/apps/sites/public/index.php;
  fastcgi_param DOCUMENT_ROOT /opt/imagine/apps/sites/public;
  fastcgi_param HTTPS on;
  fastcgi_pass app:9000;
  fastcgi_read_timeout 10s;
 }
 location / {return 404;}
}
server {
 # Private Docker network ONLY: no host publication of this mTLS listener.
 listen 9443 ssl;
 server_name _;
 ssl_certificate /run/secrets/tls_certificate;
 ssl_certificate_key /run/secrets/tls_key;
 ssl_client_certificate /run/secrets/portal_client_ca;
 ssl_verify_client on;
 ssl_verify_depth 2;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 if ($portal_identity_allowed = 0) {return 403;}
 add_header Cache-Control no-store always;
 location = /_private/health {
  default_type application/json;
  return 200 '{"transport":"mtls","operational_authority":"unavailable","can_accept_orders":false,"can_publish":false}';
 }
 location / {return 503;}
}
