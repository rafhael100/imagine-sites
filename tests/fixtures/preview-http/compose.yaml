name: sites-preview-http-ci
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sites_preview_http_ci
      POSTGRES_PASSWORD_FILE: /run/ci/db-password
    command: ['postgres','-c','ssl=on','-c','ssl_cert_file=/run/ci/db.pem','-c','ssl_key_file=/run/ci/db.key']
    volumes: ['${PREVIEW_CI_MATERIAL:?CI materials only}:/run/ci:ro']
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U postgres -d sites_preview_http_ci']
      interval: 3s
      retries: 20
    mem_limit: 768m
  app:
    build:
      context: ../../..
      dockerfile: ops/staging/Dockerfile
      target: sites-php
    environment:
      APP_ENV: staging
      APP_DEBUG: 'false'
      APP_URL: https://127.0.0.1:18496
      APP_NAME: Imagine Sites CI
      SITES_APP_KEY_FILE: /run/secrets/app_key
      SITES_PRIVATE_PREVIEW_ENABLED: 'true'
      SESSION_DRIVER: cookie
      SESSION_SECURE_COOKIE: 'true'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: strict
      SESSION_COOKIE: sites-preview-ci
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: sites_preview_http_ci
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/secrets/database_ca
      LOG_CHANNEL: stderr
      LOG_LEVEL: critical
    volumes:
      - '${PREVIEW_CI_MATERIAL}/app_key:/run/secrets/app_key:ro'
      - '${PREVIEW_CI_MATERIAL}/ca.pem:/run/secrets/database_ca:ro'
      - '${PREVIEW_CI_MATERIAL}/preview_principals:/run/secrets/preview_principals:ro'
    networks: [private]
    read_only: true
    tmpfs: ['/tmp:mode=1777','/opt/imagine/apps/sites/storage/framework/views:uid=33,gid=33,mode=0700']
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
  proxy:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    entrypoint: ['nginx','-g','daemon off;']
    volumes:
      - '../../../ops/staging/nginx-main.conf:/etc/nginx/nginx.conf:ro'
      - '../../../ops/preview-candidate/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - '${PREVIEW_CI_MATERIAL}/server.pem:/run/secrets/tls_certificate:ro'
      - '${PREVIEW_CI_MATERIAL}/server.key:/run/secrets/tls_key:ro'
      - '${PREVIEW_CI_MATERIAL}/access_passwords:/run/secrets/access_passwords:ro'
      - '${PREVIEW_CI_MATERIAL}/ca.pem:/run/secrets/portal_client_ca:ro'
      - '${PREVIEW_CI_MATERIAL}/portal_identities:/run/secrets/portal_identities:ro'
    networks: [private, ingress]
    ports: ['127.0.0.1:18496:8443']
    depends_on: [app]
    mem_limit: 128m
networks:
  private: {internal: true}
  ingress: {}
# Ephemeral CI only. This is NOT a VPS deployment overlay. No production credentials or volumes.
