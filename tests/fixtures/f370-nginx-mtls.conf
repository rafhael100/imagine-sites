# F1-370 — CI-only reverse proxy, loopback mTLS for synthetic Sites HTTP.
# Never mount this nginx config or any key material on operational hosts.
events {}
http {
    access_log off;
    server_tokens off;
    server {
        listen 127.0.0.1:18970 ssl;
        server_name sites-f370.test;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 16k;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        if ($host != 'sites-f370.test') { return 421; }
        location / {
            proxy_pass http://127.0.0.1:18965;
            proxy_set_header Host "127.0.0.1:18965";
            proxy_set_header X-Forwarded-Proto "https";
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 8s;
            proxy_connect_timeout 2s;
        }
    }
}
